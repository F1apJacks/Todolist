  /* ---------- 栄養（1日の目標カロリーとPFC） ---------- */
  const NUT_ACT = [[1.2, '座り中心', 'デスクワーク・運動なし'], [1.375, '軽く動く', '週1〜3回の運動'], [1.55, 'ふつうに運動', '週3〜5回の運動'], [1.725, 'よく動く', 'ほぼ毎日・肉体労働']];
  const NUT_GOAL = { cut: { label: '減量', f: .85, p: 2.0 }, keep: { label: '維持', f: 1, p: 1.6 }, gain: { label: '筋肥大', f: 1.10, p: 1.8 } };
  const FOODS = [
    ['鶏むね肉（皮なし）', '100g', 23, 105], ['卵', '1個', 6, 70], ['納豆', '1パック（45g）', 7, 90],
    ['牛乳', '200ml', 7, 135], ['木綿豆腐', '半丁（150g）', 10, 110], ['ごはん', '150g', 4, 250]
  ];
  const fmtN = n => Math.round(n).toLocaleString('ja-JP');

  function nutCalc(n) {
    const age = +n.age, h = +n.height, w = +n.weight;
    if (!(age >= 12 && age <= 100 && h >= 120 && h <= 230 && w >= 30 && w <= 250)) return null;
    const male = n.sex !== 'f', notes = [];
    const bmr = 10 * w + 6.25 * h - 5 * age + (male ? 5 : -161);   // Mifflin-St Jeor
    const gd = state.gh && state.gh.data;
    const measured = !!(state.gh && state.gh.useMeasured && gd && gd.avgKcal7);
    const tdee = measured ? gd.avgKcal7 : bmr * (+n.act || 1.55);
    const bmi = w / Math.pow(h / 100, 2);
    let goal = NUT_GOAL[n.goal] ? n.goal : 'keep';
    if (age < 18 && goal !== 'keep') { goal = 'keep'; notes.push('18歳未満は成長期のため、減量・増量の計算はせず、維持カロリーを表示しています。'); }
    if (goal === 'cut' && bmi < 18.5) { goal = 'keep'; notes.push('BMIが低めのため、減量ではなく維持カロリーを表示しています。'); }
    let kcal = tdee * NUT_GOAL[goal].f;
    const floor = Math.max(bmr, male ? 1500 : 1200);
    if (goal === 'cut' && kcal < floor) { kcal = floor; notes.push('下げすぎを防ぐため、下限（基礎代謝、または男性1,500・女性1,200kcalの高いほう）にそろえました。'); }
    kcal = Math.round(kcal / 10) * 10;
    let p = Math.round(w * NUT_GOAL[goal].p);
    p = Math.min(p, Math.round(kcal * .35 / 4));
    let f = Math.max(Math.round(kcal * .25 / 9), Math.round(w * .6));
    let c = Math.max(0, Math.round((kcal - p * 4 - f * 9) / 4));
    const tot = p * 4 + f * 9 + c * 4 || 1;
    return { bmr: Math.round(bmr), tdee: Math.round(tdee), kcal, diff: kcal - Math.round(tdee), bmi: Math.round(bmi * 10) / 10, goal, p, f, c, pp: p * 4 / tot, fp: f * 9 / tot, cp: c * 4 / tot, water: Math.round(w * 35 / 100) / 10, w, notes, male, measured };
  }
  const bmiLabel = b => b < 18.5 ? '低め' : b < 25 ? 'ふつう' : '高め';

  function nutResHtml(r) {
    if (!r) return `<section class="nut-card nut-empty"><svg class="ill" viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M40 26c-6-6-18-6-24 2-8 10-2 32 8 40 6 5 10 2 16 2s10 3 16-2c10-8 16-30 8-40-6-8-18-8-24-2z"/><path d="M40 26c0-8 4-14 12-16" stroke="var(--accent)" stroke-width="4"/></svg>年齢・身長・体重を入れると、<br>1日の目安がここに表示されます。</section>`;
    const g = NUT_GOAL[r.goal];
    const diffTxt = r.diff === 0 ? '維持カロリーと同じ' : `維持カロリーより ${r.diff > 0 ? '+' : '−'}${fmtN(Math.abs(r.diff))}kcal`;
    const per = x => Math.round(x / 3);
    const foodRows = FOODS.map(([n, a, p, k]) => `<li><span><b>${n}</b><small>${a}</small></span><span>たんぱく質 約${p}g<small>約${k}kcal</small></span></li>`).join('');
    const notes = r.notes.concat([
      r.goal === 'cut' ? '減量はゆっくりが基本です。体重の減りは1週間に体重の0.5%前後（70kgなら約350g）が目安。急に減らすと筋肉も落ちやすくなります。'
        : r.goal === 'gain' ? '体重は1か月に0.5〜1kg増えるくらいが目安です。増えすぎるときは−100〜200kcal、増えないときは＋100〜200kcalで調整します。'
        : '体重が増えたり減ったりするときは、100〜200kcalずつ調整します。',
      '2週間ほど体重の変化を見て、±100〜200kcalで調整してください。',
      '数値は一般的な計算式（Mifflin-St Jeor）にもとづく目安で、個人差があります。',

    return `<section class="nut-card nut-main">
        <span class="nut-l">1日の目標カロリー</span>
        <b class="nut-kcal">${fmtN(r.kcal)}<small>kcal</small></b>

        ${r.measured ? '<p class="nut-sub">維持カロリーは、Googleヘルスの実測（直近7日の平均）を使っています。</p>' : ''}
        <div class="nut-trio"><div><b>${fmtN(r.bmr)}</b><span>基礎代謝</span></div><div><b>${fmtN(r.tdee)}</b><span>維持カロリー</span></div><div><b>${r.bmi}</b><span>BMI（${bmiLabel(r.bmi)}）</span></div></div>
        ${(() => { const ws = wkSummary(todayKey()); return ws.sets ? `<p class="nut-sub w">今日の筋トレの消費（目安）：約${Math.round(ws.kcal)}kcal</p>` : ''; })()}
      </section>
      <section class="nut-card"><h3>三大栄養素の目安</h3>
        <div class="macro-bar" aria-hidden="true"><i class="mp" style="width:${(r.pp * 100).toFixed(1)}%"></i><i class="mf" style="width:${(r.fp * 100).toFixed(1)}%"></i><i class="mc" style="width:${(r.cp * 100).toFixed(1)}%"></i></div>
        <ul class="macro-list">
          <li class="mp"><b>たんぱく質</b><span><strong>${r.p}</strong>g</span><small>${fmtN(r.p * 4)}kcal・${Math.round(r.pp * 100)}%</small></li>
          <li class="mf"><b>脂質</b><span><strong>${r.f}</strong>g</span><small>${fmtN(r.f * 9)}kcal・${Math.round(r.fp * 100)}%</small></li>
          <li class="mc"><b>炭水化物</b><span><strong>${r.c}</strong>g</span><small>${fmtN(r.c * 4)}kcal・${Math.round(r.cp * 100)}%</small></li>
        </ul>
        <p class="nut-foot">たんぱく質は体重1kgあたり約${(r.p / r.w).toFixed(1)}g。筋トレをする人の目安（1.6〜2.2g）の範囲です。</p>
      </section>
      <section class="nut-card"><h3>1食あたり（3食に分けた場合）</h3>
        <div class="nut-trio meal"><div><b>${per(r.p)}g</b><span>たんぱく質</span></div><div><b>${per(r.f)}g</b><span>脂質</span></div><div><b>${per(r.c)}g</b><span>炭水化物</span></div></div>
        <p class="nut-foot">1食約${fmtN(r.kcal / 3)}kcal。食事でたりないときは、間食でたんぱく質（牛乳・ヨーグルト・卵など）を足すと楽です。</p>
      </section>
      <section class="nut-card"><h3>水分</h3>
        <p class="nut-water"><b>約${r.water}L</b><span>体重×35mlが目安。汗をかいた日は多めに。</span></p>
      </section>
      <section class="nut-card"><h3>たんぱく質をとれる食べ物の例</h3>
        <ul class="foods">${foodRows}</ul>
        <p class="nut-foot">数値は目安です。メーカーや調理法で変わります。</p>
      </section>
      <section class="nut-card nut-notes"><h3>気をつけること</h3><ul>${notes.map(t => `<li>${esc(t)}</li>`).join('')}</ul></section>`;
  }

  function nutFormHtml() {
    const n = state.nut;
    const seg = (k, opts) => `<div class="seg">${opts.map(([v, l]) => `<button type="button" class="${String(n[k]) === String(v) ? 'on' : ''}" data-act="nut-set" data-k="${k}" data-v="${v}">${l}</button>`).join('')}</div>`;
    const inp = (k, label, unit, mode) => `<label class="nf"><span>${label}</span><input type="number" inputmode="${mode}" step="${mode === 'decimal' ? '0.1' : '1'}" data-nut="${k}" value="${esc(n[k])}" aria-label="${label}"><i>${unit}</i></label>`;
    return `<section class="nut-card nut-form">

        <div class="nut-grid">${inp('age', '年齢', '歳', 'numeric')}${inp('height', '身長', 'cm', 'decimal')}${inp('weight', '体重', 'kg', 'decimal')}</div>
        <p class="nf-l">ふだんの活動量</p>
        <div class="opts">${NUT_ACT.map(([v, l, d]) => `<button type="button" class="${+n.act === v ? 'on' : ''}" data-act="nut-set" data-k="act" data-v="${v}"><b>${l}</b><small>${d}</small></button>`).join('')}</div>
        <p class="nf-l">目標</p>${seg('goal', [['cut', '減量'], ['keep', '維持'], ['gain', '筋肥大']])}
      </section>
      <div id="nut-res">${nutResHtml(nutCalc(n))}</div>
      <section class="nut-card gh-card" id="gh-card">${ghCardHtml()}</section>`;
  }
  function renderNutrition() { $('#nut-body').innerHTML = nutFormHtml(); }
  function nutUpdate() { $('#nut-res').innerHTML = nutResHtml(nutCalc(state.nut)); renderHero(); }
  function renderNutHero() {
    const r = nutCalc(state.nut);
    cancelAnimationFrame(heroRaf);
    $('#hero-label').textContent = '1日の目標カロリー';
    if (r) {
      tweenHero(r.kcal, 'kcal');
      $('#hero-sub').textContent = `${NUT_GOAL[r.goal].label}　たんぱく質 ${r.p}g`;
      $('#hero-frac').textContent = NUT_GOAL[r.goal].label;
      $('#hero-prg').style.strokeDashoffset = '0';
    } else {
      heroNum = 0; $('#hero-num').textContent = '—';

      $('#hero-prg').style.strokeDashoffset = '263.9';

    return !!r;
  }
  document.addEventListener('input', e => {
    const t = e.target;
    if (t && t.dataset && t.dataset.nut) { state.nut[t.dataset.nut] = t.value; save(); nutUpdate(); }
  });


  /* ---------- Googleヘルス連携（Google Health API v4） ---------- */
  const GH_BASE = 'https://health.googleapis.com/v4';
  const GH_SCOPE_LIST = ['activity_and_fitness', 'health_metrics_and_measurements', 'sleep'].map(s => `https://www.googleapis.com/auth/googlehealth.${s}.readonly`);
  const GH_SCOPES = GH_SCOPE_LIST.join(' ');
  const ghTokenOk = () => !!(state.gh.token && Date.now() < state.gh.exp);
  let ghBusy = false, ghStatus = '', ghErr = '';

  const ghErrorOf = (code, msg) => Object.assign(new Error(msg), { code });
  async function ghFetch(path, opts) {
    let r;
    try {
      r = await fetch(GH_BASE + path, Object.assign({ headers: { Authorization: 'Bearer ' + state.gh.token, Accept: 'application/json', 'Content-Type': 'application/json' } }, opts));
    } catch (e) {
      throw ghErrorOf(0, 'Googleのサーバーにつながりませんでした。通信状況を確認してください（ブラウザの制限で拒否された可能性もあります）。');
    }
    if (r.status === 401) { state.gh.token = ''; state.gh.exp = 0; save(); throw ghErrorOf(401, 'ログインの有効期限が切れました。もう一度つないでください。'); }
    if (!r.ok) {
      let msg = '', reason = '';
      try { const j = await r.json(); msg = (j.error && (j.error.message || j.error.status)) || ''; reason = ((j.error && j.error.details) || []).map(d => d.reason).filter(Boolean)[0] || ''; } catch (e) {}
      if (reason === 'ACCOUNT_NOT_LINKED') throw ghErrorOf(400, 'このGoogleアカウントは、まだGoogleヘルスにつながっていません。Google Healthアプリでログインしてから、もう一度試してください。');
      if (r.status === 403) throw ghErrorOf(403, `許可されていません（403）。スコープの追加や、テストユーザーの登録を確認してください。${msg ? '（' + msg + '）' : ''}`);
      throw ghErrorOf(r.status, `取得に失敗しました（${r.status}${msg ? '：' + msg : ''}）`);
    }
    return r.json();
  }

  const ghDay = n => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); };
  const ghCivil = d => ({ date: { year: d.getFullYear(), month: d.getMonth() + 1, day: d.getDate() }, time: { hours: 0, minutes: 0, seconds: 0, nanos: 0 } });
  const ghKey = d => key(d);
  const ghCivilKey = c => { const x = c && c.date; return x ? `${x.year}-${pad(x.month)}-${pad(x.day)}` : ''; };
  const ghNum = v => { const n = parseFloat(v); return isFinite(n) ? n : null; };
  const ghRoll = (type, fromDay) => ghFetch(`/users/me/dataTypes/${type}/dataPoints:dailyRollUp`, { method: 'POST', body: JSON.stringify({ range: { start: ghCivil(ghDay(fromDay)), end: ghCivil(ghDay(1)) }, windowSizeDays: 1 }) });

  async function ghSync() {
    if (ghBusy) return;
    if (!ghTokenOk()) { ghErr = 'まだつながっていません。'; ghRefreshUi(); return; }
    ghBusy = true; ghErr = ''; ghStatus = '取り込み中…'; ghRefreshUi();
    const data = { at: Date.now(), errors: [] };
    const step = async (label, fn) => { try { await fn(); } catch (e) { if (e.code === 401 || e.code === 0 || e.code === 400) throw e; data.errors.push(`${label}：${e.message}`); } };
    try {
      await ghFetch('/users/me/identity');
      const today = ghKey(ghDay(0));
      await step('体重', async () => {
        const r = await ghRoll('weight', -59);
        const pts = (r.rollupDataPoints || []).map(p => ({ d: ghCivilKey(p.civilStartTime), g: ghNum(p.weight && p.weight.weightGramsAvg) })).filter(p => p.g);
        if (pts.length) { const l = pts[pts.length - 1]; data.weightKg = Math.round(l.g / 100) / 10; data.weightDate = l.d; }
      });
      await step('総消費カロリー', async () => {
        const r = await ghRoll('total-calories', -13);
        const pts = (r.rollupDataPoints || []).map(p => ({ d: ghCivilKey(p.civilStartTime), v: ghNum(p.totalCalories && p.totalCalories.kcalSum) })).filter(p => p.v);
        data.calories = pts.map(p => ({ date: p.d, kcal: Math.round(p.v) }));
        const full = pts.filter(p => p.d !== today && p.v > 800).slice(-7);
        if (full.length >= 3) data.avgKcal7 = Math.round(full.reduce((s, p) => s + p.v, 0) / full.length);
        const t = pts.find(p => p.d === today); if (t) data.todayKcal = Math.round(t.v);
      });
      await step('歩数', async () => {
        const r = await ghRoll('steps', -6);
        const pts = (r.rollupDataPoints || []).map(p => ({ d: ghCivilKey(p.civilStartTime), n: ghNum(p.steps && p.steps.countSum) })).filter(p => p.n != null);
        data.steps = pts.map(p => ({ date: p.d, n: Math.round(p.n) }));
        const t = pts.find(p => p.d === today); if (t) data.stepsToday = Math.round(t.n);
        const full = pts.filter(p => p.d !== today && p.n > 0);
        if (full.length) data.stepsAvg7 = Math.round(full.reduce((s, p) => s + p.n, 0) / full.length);
      });
      await step('睡眠', async () => {
        const f = encodeURIComponent(`sleep.interval.civil_end_time >= "${ghKey(ghDay(-1))}"`);
        const r = await ghFetch(`/users/me/dataTypes/sleep/dataPoints:reconcile?filter=${f}`);
        const list = (r.dataPoints || []).map(p => p.sleep).filter(s => s && s.summary && (!s.metadata || s.metadata.main !== false));
        list.sort((a, b) => String((b.interval || {}).endTime).localeCompare(String((a.interval || {}).endTime)));
        if (list.length) { const m = ghNum(list[0].summary.minutesAsleep); if (m) { data.sleepMin = Math.round(m); data.sleepDate = key(new Date((list[0].interval || {}).endTime || Date.now())); } }
      });
      await step('運動記録', async () => {
        const f = encodeURIComponent(`exercise.interval.civil_start_time >= "${ghKey(ghDay(-6))}T00:00:00"`);
        const r = await ghFetch(`/users/me/dataTypes/exercise/dataPoints?filter=${f}`);
        data.exercises = (r.dataPoints || []).map(p => {
          const x = p.exercise || {}, iv = x.interval || {}, ms = x.metricsSummary || {};
          const sec = ghNum(x.activeDuration) || ((Date.parse(iv.endTime) - Date.parse(iv.startTime)) / 1000) || 0;
          return { date: ghCivilKey(iv.civilStartTime) || key(new Date(iv.startTime || Date.now())), name: x.displayName || x.exerciseType || '運動', min: Math.round(sec / 60), kcal: ghNum(ms.caloriesKcal), t: Date.parse(iv.startTime) || 0 };
        }).sort((a, b) => b.t - a.t).slice(0, 8);
      });
      await step('身長', async () => {
        const r = await ghFetch('/users/me/dataTypes/height/dataPoints?page_size=1');
        const h = ((r.dataPoints || [])[0] || {}).height;
        if (h) for (const k of Object.keys(h)) {
          const v = ghNum(h[k]); if (v == null) continue;
          if (/millimet/i.test(k)) data.heightCm = Math.round(v / 10 * 10) / 10;
          else if (/centimet/i.test(k)) data.heightCm = Math.round(v * 10) / 10;
          else if (/met(er|re)s?$/i.test(k)) data.heightCm = Math.round(v * 1000) / 10;
        }
      });
      state.gh.data = data; save();
      ghStatus = data.errors.length ? '一部のデータは取り込めませんでした' : '取り込みました';
    } catch (e) { ghErr = e.message; ghStatus = ''; }
    ghBusy = false;
    ghRefreshUi(); wkRefreshSummary();
  }

  /* ---- 接続（A: Googleでログイン / B: トークン貼り付け） ---- */
  function ghLoadGis() {
    return new Promise((res, rej) => {
      if (window.google && google.accounts && google.accounts.oauth2) return res();
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
      s.onload = () => res(); s.onerror = () => rej(new Error('Googleのログイン部品を読み込めませんでした。通信状況を確認してください。'));
      document.head.appendChild(s);
    });
  }
  function ghSignIn() {
    const id = (state.gh.clientId || '').trim();
    if (!id) { ghErr = 'クライアントIDを入れてください。'; ghRefreshUi(); return; }
    if (!(window.google && google.accounts && google.accounts.oauth2)) { ghErr = 'ログイン部品を準備中です。数秒待ってからもう一度押してください。'; ghLoadGis().catch(e => { ghErr = e.message; }).then(ghRefreshUi); ghRefreshUi(); return; }
    ghErr = '';
    try {
      const tc = google.accounts.oauth2.initTokenClient({
        client_id: id, scope: GH_SCOPES,
        callback: r => {
          if (r && r.access_token) { state.gh.token = r.access_token; state.gh.exp = Date.now() + (Math.max(60, +r.expires_in || 3600) - 60) * 1000; save(); ghErr = ''; ghRefreshUi(); ghSync(); }
          else { ghErr = `ログインできませんでした${r && r.error ? '（' + r.error + '）' : ''}。クライアントIDとテストユーザーの登録を確認してください。`; ghRefreshUi(); }
        },
        error_callback: e => { ghErr = e && e.type === 'popup_closed' ? 'ログインがキャンセルされました。' : `ログイン画面を開けませんでした${e && e.type ? '（' + e.type + '）' : ''}。Safariで開いたページから試してください。`; ghRefreshUi(); }
      });
      tc.requestAccessToken({ prompt: '' });
    } catch (e) { ghErr = 'ログインを始められませんでした：' + e.message; ghRefreshUi(); }
  }
  let ghTokenDraft = '';
  function ghUseToken() {
    const t = ghTokenDraft.replace(/^Bearer\s+/i, '').trim();
    if (t.length < 20) { ghErr = 'アクセストークン（ya29. で始まる長い文字列）を貼ってください。'; ghRefreshUi(); return; }
    state.gh.token = t; state.gh.exp = Date.now() + 55 * 60 * 1000; save(); ghTokenDraft = ''; ghErr = '';
    ghRefreshUi(); ghSync();
  }
  function ghDisconnect() { state.gh.token = ''; state.gh.exp = 0; save(); ghErr = ''; ghStatus = ''; ghRefreshUi(); }

  /* ---- 画面 ---- */
  const fmtHM = m => `${Math.floor(m / 60)}時間${m % 60 ? (m % 60) + '分' : ''}`;
  function ghSheetHtml() {
    const ok = ghTokenOk();
    const until = ok ? new Date(state.gh.exp) : null;
    const scopes = GH_SCOPE_LIST.map(s => `<code>${s}</code>`).join('');
    const methods = `
      <div class="gh-m"><h4>方法A　Googleでログイン</h4>
        <p>準備で作った「クライアントID」を貼ると、Googleのログイン画面で許可するだけでつながります。</p>
        <input class="field full" data-gh="clientId" placeholder="xxxx.apps.googleusercontent.com" value="${esc(state.gh.clientId)}" autocomplete="off" autocapitalize="off" aria-label="クライアントID">
        <button type="button" class="primary wide" data-act="gh-signin">Googleでログイン</button></div>
      <div class="gh-m"><h4>方法B　アクセストークンを貼り付け</h4>
        <p>OAuth 2.0 Playground で取り出したアクセストークン（ya29. で始まる文字列）を貼ります。有効期限は約1時間です。</p>
        <input class="field full" data-gh="token" placeholder="ya29.…" value="${esc(ghTokenDraft)}" autocomplete="off" autocapitalize="off" aria-label="アクセストークン">
        <button type="button" class="primary wide" data-act="gh-token">この内容でつなぐ</button></div>`;
    return `<div class="sheet-head"><h2>Googleヘルスと連携</h2><button class="link" data-act="close">閉じる</button></div>
      <div class="sheet-body">
        <div class="gh-stat${ok ? ' on' : ''}"><i></i><span>${ok ? `つながっています（${until.getHours()}:${pad(until.getMinutes())}まで）` : 'まだつながっていません'}</span></div>
        ${ghErr ? `<p class="gh-err">${esc(ghErr)}</p>` : ''}
        ${ghStatus ? `<p class="gh-ok">${esc(ghStatus)}</p>` : ''}
        ${ok ? `<button type="button" class="primary wide" data-act="gh-sync"${ghBusy ? ' disabled' : ''}>${ghBusy ? '取り込み中…' : 'データを取り込む'}</button>
          <button type="button" class="danger" data-act="gh-disconnect">つなぎを解除（トークンを消す）</button>` : methods}
        <details class="more"><summary>はじめに必要な準備（一度だけ）</summary>
          <div class="ex-sec"><ol class="steps gh-steps">
            <li>スマホの <b>Google Healthアプリ</b> を入れ、連携したいGoogleアカウントでログインします（Fitbitアカウントの人は、Googleアカウントへの移行が必要です）。</li>
            <li><b>Google Cloud Console</b> でプロジェクトを作り、「APIとサービス → ライブラリ」で <b>Google Health API</b> を有効にします。</li>
            <li>「認証情報 → OAuthクライアントID」を<b>ウェブアプリケーション</b>で作ります。<br>方法Aなら「承認済みのJavaScript生成元」に、このアプリを置いたURL（例：https://ユーザー名.github.io）を入れます。<br>方法Bなら「承認済みのリダイレクトURI」に <code>https://developers.google.com/oauthplayground</code> を入れ、クライアントシークレットも控えます。</li>
            <li>「Google Auth Platform」の「対象」で、公開ステータスが<b>テスト</b>のまま、<b>テストユーザー</b>に自分のGoogleアカウントを追加します。</li>
            <li>「データアクセス」で、次の読み取りスコープ3つを追加します。${scopes}<button type="button" class="ex-edit" data-act="gh-copyscopes">スコープをコピー</button></li>
            <li>方法Bの場合：OAuth 2.0 Playgroundの設定（歯車）で「Use your own OAuth credentials」にクライアントIDとシークレットを入れ、上のスコープで承認 → 「Exchange authorization code for tokens」で出る<b>access_token</b>をコピーします。</li>
          </ol></div>
        </details>
        <p class="note">Googleの正式な連携方法は、サーバーでクライアントシークレットを守りながら使う形です。このアプリはサーバーを持たないため、あなた自身のGoogle Cloudプロジェクトで、あなた自身のアカウントのデータだけを読み取ります。公開ステータスが「テスト」の間は、利用者は登録したテストユーザーだけです。取り込んだデータとトークンは、この端末の中にだけ保存されます。</p>
      </div>`;
  }
  function ghCardHtml() {
    const ok = ghTokenOk(), d = state.gh.data;
    let body = '';
    if (d) {
      const rows = [];
      if (d.weightKg) rows.push(`<li><span><b>体重</b><small>${d.weightDate ? d.weightDate.slice(5).replace('-', '/') : ''}</small></span><span><strong>${d.weightKg}</strong>kg${+state.nut.weight === d.weightKg ? '' : `<button type="button" class="gh-btn" data-act="gh-apply-weight">入力欄に反映</button>`}</span></li>`);
      if (d.heightCm) rows.push(`<li><span><b>身長</b></span><span><strong>${d.heightCm}</strong>cm${+state.nut.height === d.heightCm ? '' : `<button type="button" class="gh-btn" data-act="gh-apply-height">入力欄に反映</button>`}</span></li>`);
      if (d.sleepMin) rows.push(`<li><span><b>昨夜の睡眠</b></span><span><strong>${fmtHM(d.sleepMin)}</strong></span></li>`);
      if (d.stepsToday != null || d.stepsAvg7) rows.push(`<li><span><b>歩数</b><small>7日平均 ${d.stepsAvg7 ? fmtN(d.stepsAvg7) : '–'}</small></span><span><strong>${d.stepsToday != null ? fmtN(d.stepsToday) : '–'}</strong>歩（今日）</span></li>`);
      if (d.avgKcal7) rows.push(`<li><span><b>1日の総消費カロリー</b><small>直近7日の平均（実測）</small></span><span><strong>${fmtN(d.avgKcal7)}</strong>kcal</span></li>`);
      const ex = (d.exercises || []).slice(0, 3).map(x => `<li><span><b>${esc(x.name)}</b><small>${x.date.slice(5).replace('-', '/')}</small></span><span><strong>${x.min}</strong>分${x.kcal != null ? `　約${Math.round(x.kcal)}kcal` : ''}</span></li>`).join('');
      const sw = d.avgKcal7 ? `<div class="gh-sw"><span><b>目標カロリーを実測ベースにする</b><small>計算式のかわりに、直近7日の実測（${fmtN(d.avgKcal7)}kcal）を維持カロリーとして使います。</small></span>
        <button type="button" class="tgl${state.gh.useMeasured ? ' on' : ''}" data-act="gh-measured" role="switch" aria-checked="${!!state.gh.useMeasured}" aria-label="実測ベース"><i></i></button></div>` : '';
      const t = new Date(d.at);
      body = `<ul class="gh-list">${rows.join('')}${ex}</ul>${sw}
        ${d.errors && d.errors.length ? `<p class="gh-err">${d.errors.map(esc).join('<br>')}</p>` : ''}
        <p class="nut-foot">取り込み：${t.getMonth() + 1}/${t.getDate()} ${t.getHours()}:${pad(t.getMinutes())}。データはこの端末にだけ保存されます。</p>`;
    } else {
      body = '<p class="nut-foot">体重・睡眠・歩数・総消費カロリー・運動記録を取り込んで、栄養の目安や回復の目安に使います。</p>';
    }
    return `<h3>Googleヘルス<small class="gh-tag">連携</small></h3>${body}
      <div class="gh-acts">${ok ? `<button type="button" class="primary" data-act="gh-sync"${ghBusy ? ' disabled' : ''}>${ghBusy ? '取り込み中…' : 'データを取り込む'}</button>` : ''}
        <button type="button" class="gh-set" data-act="gh-open">${ok ? '接続の設定' : '連携をはじめる'}</button></div>`;
  }
  function ghRefreshUi() {
    if (cur && cur.kind === 'gh') { sheet.classList.remove('fresh'); setSheet(ghSheetHtml()); }
    const c = $('#gh-card'); if (c) c.innerHTML = ghCardHtml();
  }
  if (ghTokenOk() === false && state.gh.token) { state.gh.token = ''; state.gh.exp = 0; }
  document.addEventListener('input', e => {
    const t = e.target;
    if (!t || !t.dataset || !t.dataset.gh) return;
    if (t.dataset.gh === 'clientId') { state.gh.clientId = t.value.trim(); save(); }
    else if (t.dataset.gh === 'token') ghTokenDraft = t.value;
  });


  /* ---------- 筋トレ・タイマー・栄養のボタン処理 ---------- */
  function wkAction(act, el) {
    const d = el.dataset;
    switch (act) {
      case 'wk-day': wkSel = +d.d; renderWorkout(true); break;
      case 'wk-play': { const f = wkFigs[d.ex]; if (f) f.toggle(); break; }
      case 'wk-toggle': wkToggleEx(d.ex); break;
      case 'wk-menu-open': openSheet({ kind: 'wkmenu' }, wkMenuHtml()); break;
      case 'wk-pick':
        if (MENUS[d.m]) { state.wkMenu = d.m; save(); }
        closeSheet(); renderHeader(true); renderWorkout(true); break;
      case 'wk-step': {
        const id = d.ex, k = d.k, e = EX[id], c = exCfg(id);
        c[k] = Math.max(cfgMin(e, k), Math.min(cfgMax(e, k), c[k] + (+d.d) * cfgStep(e, k)));
        state.wkCfg[cfgKey(id)] = { sets: c.sets, reps: c.reps, rest: c.rest };
        if (cfgIsRec(id)) delete state.wkCfg[cfgKey(id)];
        save(); wkCfgUpdate(id); break;
      }
      case 'wk-reset': delete state.wkCfg[cfgKey(d.ex)]; save(); wkCfgUpdate(d.ex); break;
      case 'wk-setgo': wkSetGo(d.ex); break;
      case 'wk-setpill': wkPill(d.ex, +d.k); break;

      /* タイマー */
      case 'tm-open': openSheet({ kind: 'timer' }, tmSheetHtml()); break;
      case 'tm-preset': tmFree = +d.s; sheet.classList.remove('fresh'); setSheet(tmSheetHtml()); break;
      case 'tm-step': tmFree = Math.max(5, Math.min(3600, tmFree + (+d.d) * (tmFree <= 60 ? 5 : 15))); sheet.classList.remove('fresh'); setSheet(tmSheetHtml()); break;
      case 'tm-start': closeSheet(); startTimer({ phases: [{ kind: 'free', sec: tmFree }], label: 'タイマー' }); break;
      case 'tm-snd': state.snd = !state.snd; save(); sheet.classList.remove('fresh'); setSheet(tmSheetHtml()); audioUnlock(); if (state.snd) SFX.test(); break;
      case 'tm-pause': tmPause(); break;
      case 'tm-add': tmAdd(15); break;
      case 'tm-close': stopTimer(); break;

      /* 自分のメニュー・種目 */
      case 'wk-ed-new': ed = newEd(null); edRender(true); break;
      case 'wk-ed-open': { const m = state.wkCustom.find(x => x.id === d.m); if (m) { ed = newEd(m); edRender(true); } break; }
      case 'wk-ed-cancel': ed = null; closeSheet(); break;
      case 'wk-ed-save': edSave(); break;
      case 'wk-ed-delmenu': edDeleteMenu(); break;
      case 'wk-ed-add': ed.day = +d.d; ed.view = 'pick'; ed.cat = 'all'; edRender(); break;
      case 'wk-ed-rm': ed.days[d.d].ex.splice(+d.i, 1); edRender(); break;
      case 'wk-ed-mv': {
        const a = ed.days[d.d].ex, i = +d.i, j = i + (+d.dir);
        if (j >= 0 && j < a.length) { const t = a[i]; a[i] = a[j]; a[j] = t; }
        edRender(); break;
      }
      case 'wk-ed-cat': ed.cat = d.c; edRender(); break;
      case 'wk-ed-pick': {
        const a = ed.days[ed.day].ex, at = a.indexOf(d.id);
        if (at >= 0) a.splice(at, 1); else a.push(d.id);
        el.classList.toggle('on', at < 0); el.setAttribute('aria-pressed', String(at < 0));
        const lk = sheet.querySelector('.sheet-head .link'); if (lk) lk.textContent = `完了（${a.length}）`;
        break;
      }
      case 'wk-ed-pickdone': ed.view = 'main'; edRender(); break;
      case 'wk-ex-new': ed.exf = { id: null, name: '', unit: '回', sets: 3, reps: 10, rest: 60, note: '' }; ed.view = 'ex'; edRender(); break;
      case 'wk-ex-edit': {
        const c = state.wkEx[d.ex]; if (!c) break;
        ed = newEd(null); ed.standalone = true; ed.view = 'ex';
        ed.exf = { id: c.id, name: c.name, unit: c.unit, sets: c.sets, reps: c.reps, rest: c.rest, note: c.note || '' };
        edRender(true); break;
      }
      case 'wk-ex-back': if (ed.standalone) { ed = null; closeSheet(); } else { ed.exf = null; ed.view = 'pick'; edRender(); } break;
      case 'wk-exf-unit':
        if (ed.exf.unit !== d.u) { ed.exf.unit = d.u; ed.exf.reps = d.u === '秒' ? 30 : 10; edRender(); } break;
      case 'wk-ex-save': exfSave(); break;
      case 'wk-ex-del': exfDelete(); break;

      /* Googleヘルス */
      case 'gh-open': openSheet({ kind: 'gh' }, ghSheetHtml()); ghLoadGis().catch(() => {}); break;
      case 'gh-signin': ghSignIn(); break;
      case 'gh-token': ghUseToken(); break;
      case 'gh-sync': ghSync(); break;
      case 'gh-disconnect': ghDisconnect(); break;
      case 'gh-copyscopes':
        try { navigator.clipboard.writeText(GH_SCOPES).then(() => toast('スコープをコピーしました'), () => toast('コピーできませんでした')); } catch (e) { toast('コピーできませんでした'); }
        break;
      case 'gh-apply-weight': if (state.gh.data && state.gh.data.weightKg) { state.nut.weight = String(state.gh.data.weightKg); save(); renderNutrition(); nutUpdate(); toast('体重を反映しました'); } break;
      case 'gh-apply-height': if (state.gh.data && state.gh.data.heightCm) { state.nut.height = String(state.gh.data.heightCm); save(); renderNutrition(); nutUpdate(); toast('身長を反映しました'); } break;
      case 'gh-measured': state.gh.useMeasured = !state.gh.useMeasured; save(); ghRefreshUi(); nutUpdate(); break;

      /* 栄養 */
      case 'nut-set': {
        const k = d.k, v = (k === 'act') ? +d.v : d.v;
        state.nut[k] = v; save();
        el.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el));
        nutUpdate(); break;
      }
    }
  }

  /* ---------- タスク追加時の期限入力プレビュー ---------- */

  /* ---------- sheet ---------- */
  const sheet = $('#sheet'), backdrop = $('#backdrop');

  function setSheet(html) { sheet.innerHTML = html; }
  function openSheet(c, html) {
    cur = c; setSheet(html);

  function doneHtml() {
    const now = Date.now();
    const rows = state.done.map((t, i) => {
      const left = KEEP - (now - t.at);
      const label = left <= DAY ? 'まもなく削除' : `あと${Math.ceil(left / DAY)}日で削除`;
      return `<li class="row" style="--i:${Math.min(i, 10)}" data-id="${t.id}"><div class="rowin">

  function todoEditHtml(id) {

  function habitHtml(id) {
    const h = state.habits.find(x => x.id === id), s = stats(h), t = todayKey();
    const dow = (parse(t).getDay() + 6) % 7;
    const start = addDays(addDays(t, -dow), -28);
    let cells = '';
    for (let i = 0; i < 35; i++) {
      const d = addDays(start, i);
      const future = d > t;
      const cls = ['c', h.log[d] ? 'd' : '', future ? 'f' : '', !future && d < h.created && !h.log[d] ? 'b' : '', d === t ? 't' : ''].join(' ');
      cells += `<button class="${cls}" style="--i:${i}" data-act="toggle-day" data-day="${d}" ${future ? 'disabled' : ''} aria-label="${d}">${parse(d).getDate()}</button>`;
    }
    return `<div class="sheet-head"><h2>${esc(h.name)}</h2><button class="link" data-act="close">閉じる</button></div>
      <div class="sheet-body h${hIdx(h)}">
        <div class="facts">
          <div style="--i:0"><b>${s.streak}</b><span>連続日数</span></div>
          <div style="--i:1"><b>${s.best}</b><span>最長記録</span></div>
          <div style="--i:2"><b>${s.rate == null ? '–' : s.rate + '%'}</b><span>継続率</span></div>
          <div style="--i:3"><b>${s.count}</b><span>達成日数</span></div>
        </div>
        <div class="cal">${'月火水木金土日'.split('').map(w => `<span class="wd">${w}</span>`).join('')}${cells}</div>
        <p class="hint">日付をタップすると、付け忘れた日のチェックを直せます。</p>
        <div class="edit-row" style="margin-top:16px" data-form="edit-habit" data-id="${id}">
          <input class="field" name="text" type="text" maxlength="60" value="${esc(h.name)}" aria-label="習慣名" enterkeyhint="done" autocomplete="off">
          <button class="primary" type="button" data-act="submit-form">保存</button>
        </div>
        <button class="danger" type="button" data-act="delete-habit" data-id="${id}">この習慣を削除（記録も消えます）</button>
      </div>`;
  }

  /* ---------- actions ---------- */
  function toggleHabit(btn, id) {
    const h = state.habits.find(x => x.id === id); if (!h) return;
    const t = todayKey();
    if (h.log[t]) delete h.log[t]; else h.log[t] = 1;
    save();
    const on = !!h.log[t];
    btn.classList.toggle('on', on);
    btn.setAttribute('aria-pressed', String(on));

    const row = btn.closest('.row');
    row.querySelector('.stat').innerHTML = statHtml(h);
    row.querySelector('.dots').innerHTML = dotsHtml(h);
    const num = row.querySelector('.stat b');
    num.classList.add('up');

    const allDone = state.habits.length > 0 && state.habits.every(x => x.log[t]);
    renderHeader(true);
    if (!on) return;

    btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
    const r = btn.querySelector('.ring').getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, cssVar(btn, '--c'), 10, 40);

    const s = stats(h);
    if (allDone) { toast('今日の習慣をすべて達成！'); celebrate(); }
    else if (MILES.includes(s.streak)) {
      toast(`${h.name}  ${s.streak}日連続！`);
      burst(r.left + r.width / 2, r.top + r.height / 2, CONFETTI, 18, 80, { gravity: 60, dur: 800 });
    }
  }

  function completeTodo(btn, id) {
    const li = btn.closest('.row');
    if (!li || li.dataset.busy) return;
    const i = state.todos.findIndex(x => x.id === id); if (i < 0) return;
    li.dataset.busy = '1';
    const [item] = state.todos.splice(i, 1);
    state.done.unshift({ id: item.id, text: item.text, due: item.due || '', at: Date.now() });
    save();

    const r = btn.querySelector('.ring').getBoundingClientRect();
    const color = cssVar(btn, '--c');
    btn.classList.add('on', 'pop');
    li.classList.add('checked');
    burst(r.left + r.width / 2, r.top + r.height / 2, color, 10, 40);
    renderHeader(true);

    setTimeout(() => flyTo(r, $('#doneBtn'), color, () => renderBadge(true)), 380);
    setTimeout(() => {
      li.style.height = li.offsetHeight + 'px';
      void li.offsetHeight;
      li.style.height = '0px';
      li.classList.add('leaving');
    }, 420);
    setTimeout(() => {
      li.remove(); syncTodoEmpty();
      if (state.todos.length === 0) celebrate();
    }, 780);
  }

  let lastDeleted = null;
  function removeTodo(li, id) {
    if (li && li.dataset.busy) return;
    const i = state.todos.findIndex(x => x.id === id); if (i < 0) return;
    const [item] = state.todos.splice(i, 1);
    save();
    lastDeleted = { item, index: i };
    renderHeader();
    if (li) {
      li.dataset.busy = '1';
      li.style.height = li.offsetHeight + 'px';
      void li.offsetHeight;
      li.style.height = '0px';
      li.classList.add('leaving');
      setTimeout(() => { li.remove(); syncTodoEmpty(); }, 340);
    } else {
      renderTodos();
    }
    toast('タスクを削除しました', { label: '元に戻す', name: 'undo-delete' });
  }
  let lastHabit = null;
  function undoHabit() {
    if (!lastHabit) return;
    const { item, index } = lastHabit; lastHabit = null;
    state.habits.splice(Math.min(index, state.habits.length), 0, item);
    save(); hideToast(); renderHeader(); renderHabits(true);
  }
  function undoDelete() {
    if (!lastDeleted) return;
    const { item, index } = lastDeleted; lastDeleted = null;
    state.todos.splice(Math.min(index, state.todos.length), 0, item);
    save(); hideToast(); renderHeader(); renderTodos(true);
  }

  function replayHero() {
    const hero = $('#hero');
    hero.classList.remove('rise'); void hero.offsetWidth; hero.classList.add('rise');
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act;
    const row = el.closest('[data-id]');
    const id = row ? row.dataset.id : el.dataset.id;

    switch (act) {
      case 'tab':
        if (state.tab === el.dataset.tab) break;
        state.tab = el.dataset.tab; save();
        showTab(); renderHeader(true); replayHero();
        if (state.tab === 'daily') renderHabits(true); else if (state.tab === 'list') renderTodos(true); else if (state.tab === 'workout') renderWorkout(true); else nutUpdate();
        window.scrollTo(0, 0); break;
      case 'toggle-habit': toggleHabit(el, id); break;
      case 'open-habit': openSheet({ kind: 'habit', id }, habitHtml(id)); break;
      case 'done-todo': completeTodo(el, id); break;
      case 'edit-todo': openSheet({ kind: 'todo', id }, todoEditHtml(id)); break;
      case 'open-done': purge(); openSheet({ kind: 'done' }, doneHtml()); break;
      case 'close': closeSheet(); break;
      case 'clear-add-due': clearAddDue(); break;
      case 'submit-form': submitForm(el.closest('[data-form]')); break;
      case 'restore': {
        const i = state.done.findIndex(x => x.id === id); if (i < 0) break;
        const [it] = state.done.splice(i, 1);
        state.todos.unshift({ id: it.id, text: it.text, due: it.due || '', at: Date.now() });
        save(); renderHeader(); renderTodos(); refreshSheet(); break;
      }
      case 'delete-todo': removeTodo(null, id); closeSheet(); break;
      case 'delete-row': removeTodo(el.closest('.row'), id); break;
      case 'undo-delete': undoDelete(); break;
      case 'delete-done':
        state.done = state.done.filter(x => x.id !== id);
        save(); renderHeader(); refreshSheet(); break;
      case 'delete-habit': {
        const i = state.habits.findIndex(x => x.id === id); if (i < 0) break;
        const [h] = state.habits.splice(i, 1);
        lastHabit = { item: h, index: i };
        save(); closeSheet(); renderHeader(); renderHabits();
        toast(`「${h.name}」を削除しました`, { label: '元に戻す', name: 'undo-habit' });
        break;
      }
      case 'undo-habit': undoHabit(); break;
      default: wkAction(act, el); break;
      case 'toggle-day': {
        const h = state.habits.find(x => x.id === cur.id); if (!h) break;
        const d = el.dataset.day;
        if (h.log[d]) delete h.log[d]; else { h.log[d] = 1; if (d < h.created) h.created = d; }
        save(); renderHeader(); renderHabits(); refreshSheet(); break;
      }
    }
  });

  function submitForm(f) {
    if (!f) return;
    const kind = f.dataset.form;
    const input = f.querySelector('input[name="text"]');
    const dueInput = f.querySelector('input[name="due"]');
    const v = input ? input.value.trim() : '';
    const dueVal = dueInput ? dueInput.value : '';
    if (!v) return;

    if (kind === 'add-habit') {
      const last = state.habits[state.habits.length - 1];
      state.habits.push({ id: uid(), name: v, created: todayKey(), log: {}, c: last ? (hIdx(last) + 1) % 6 : 0 });
      save(); input.value = '';
      renderHeader(true); renderHabits();
      const li = $('#habits').lastElementChild;
      if (li) { li.classList.add('enter'); li.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
    } else if (kind === 'add-todo') {
      state.todos.unshift({ id: uid(), text: v, due: dueVal, at: Date.now() });
      save(); input.value = ''; clearAddDue();
      renderHeader(true); renderTodos();
      const first = $('#todos').firstElementChild;
      if (first) first.classList.add('enter');
    } else if (kind === 'edit-todo') {
      const t = state.todos.find(x => x.id === f.dataset.id);
      if (t) { t.text = v; t.due = dueVal; }
      save(); closeSheet(); renderTodos();
    } else if (kind === 'edit-habit') {
      const h = state.habits.find(x => x.id === f.dataset.id);
      if (h) h.name = v;
      save(); closeSheet(); renderHabits();
    }
    if (kind.indexOf('add-') === 0) {
      input.blur();
      const b = f.querySelector('.submit-btn');
      if (b) { b.classList.remove('spin'); void b.offsetWidth; b.classList.add('spin'); }
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
    if (!e.target || e.target.tagName !== 'INPUT') return;
    const f = e.target.closest('[data-form]');
    if (f) { e.preventDefault(); submitForm(f); }
  });

  /* ---------- lifecycle ---------- */
  let lastDay = todayKey();
  function tick() {
    const changedDay = todayKey() !== lastDay;
    const purged = purge();
    if (changedDay) { lastDay = todayKey(); render(); refreshSheet(); }
    else if (purged) { renderHeader(); refreshSheet(); }
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
  setInterval(tick, 60000);

  render();
})();
</script>
</body>
</html>
