<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Todo">
<meta name="theme-color" content="#EEF1F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F131C" media="(prefers-color-scheme: dark)">
<title>Todo</title>
<style>
  :root {
    --bg: #EEF1F6;
    --surface: #FFFFFF;
    --ink: #19202E;
    --sub: #6B7488;
    --faint: #A3ABBC;
    --line: #E4E8F0;
    --accent: #3347D1;
    --accent-ink: #FFFFFF;
    --danger: #D6453D;
    --warn: #D97706;
    --nav: rgba(255, 255, 255, .85);
    --shadow: 0 10px 26px -16px rgba(40, 50, 110, .38);
    --blob1: #7C8CFF;
    --blob2: #FF9CC6;
    --blob-o: .38;
    --c: var(--accent);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F131C;
      --surface: #181E2B;
      --ink: #EAEEF7;
      --sub: #98A1B7;
      --faint: #5A6379;
      --line: #262E3F;
      --accent: #7C8CFF;
      --accent-ink: #0F131C;
      --danger: #FF7A72;
      --warn: #FBBF24;
      --nav: rgba(24, 30, 43, .85);
      --shadow: 0 10px 26px -16px rgba(0, 0, 0, .7);
      --blob1: #4553D8;
      --blob2: #8A3F7A;
      --blob-o: .3;
    }
  }
  .h0 { --c: #3347D1; } .h1 { --c: #8B5CF6; } .h2 { --c: #0E9F9A; }
  .h3 { --c: #E0488B; } .h4 { --c: #E8730C; } .h5 { --c: #2E9B5A; }
  @media (prefers-color-scheme: dark) {
    .h0 { --c: #7C8CFF; } .h1 { --c: #B197FC; } .h2 { --c: #3CC9C2; }
    .h3 { --c: #FF7FB6; } .h4 { --c: #FFA24D; } .h5 { --c: #5FD38D; }
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
    -webkit-user-select: none;
  }
  input {
    user-select: auto;
    -webkit-user-select: auto;
  }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 16px;
    font-variant-numeric: tabular-nums;
    touch-action: manipulation;
    overscroll-behavior-y: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; }
  svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- background ---------- */
  .bgdeco { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .bgdeco i { position: absolute; width: 320px; height: 320px; border-radius: 50%; filter: blur(70px); opacity: var(--blob-o); }
  .bgdeco i:nth-child(1) { background: var(--blob1); top: -110px; right: -90px; animation: drift1 22s ease-in-out infinite alternate; }
  .bgdeco i:nth-child(2) { background: var(--blob2); bottom: 90px; left: -150px; animation: drift2 26s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(-50px, 70px) scale(1.12); } }
  @keyframes drift2 { to { transform: translate(60px, -60px) scale(1.1); } }

  /* ---------- header ---------- */
  .top {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
    padding: max(env(safe-area-inset-top), 14px) 20px 14px;
  }
  .top h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; }
  .top p { margin: 4px 0 0; font-size: 13px; color: var(--sub); }
  .topbtn {
    flex: none; display: flex; align-items: center; gap: 6px;
    height: 38px; padding: 0 14px 0 11px; border-radius: 19px;
    background: var(--surface); box-shadow: var(--shadow);
    font-size: 14px; font-weight: 600;
    transition: transform .15s ease;
  }
  .topbtn:active { transform: scale(.94); }
  .topbtn.catch { animation: catch .5s cubic-bezier(.3, 1.5, .5, 1); }
  @keyframes catch { 0% { transform: scale(1); } 35% { transform: scale(1.14) rotate(-3deg); } 100% { transform: scale(1); } }
  .topbtn svg.i { width: 20px; height: 20px; }
  .badge {
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    background: var(--accent); color: var(--accent-ink);
    font-size: 11px; font-weight: 700; display: grid; place-items: center;
  }
  .badge.bump { animation: bump .5s ease; }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.6); } 100% { transform: scale(1); } }

  /* ---------- hero ---------- */
  .hero {
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    margin: 0 16px 18px; padding: 18px 20px;
    border-radius: 24px; color: #fff;
    background: linear-gradient(135deg, #3A4FE0 0%, #6C4DE4 58%, #8B5CF6 100%);
    box-shadow: 0 16px 30px -16px rgba(60, 60, 220, .65);
  }
  .hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; pointer-events: none; }
  .hero::before { width: 190px; height: 190px; right: -50px; top: -80px; background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, .28), rgba(255, 255, 255, 0) 70%); }
  .hero::after { width: 120px; height: 120px; left: -40px; bottom: -64px; background: rgba(255, 255, 255, .09); }
  .hero.rise { animation: rise .5s cubic-bezier(.2, .8, .2, 1) backwards; }
  .hero-main { position: relative; z-index: 1; min-width: 0; }
  .hero-label { display: block; font-size: 13px; font-weight: 600; opacity: .85; }
  .hero-num { display: block; font-size: 46px; font-weight: 800; line-height: 1.1; letter-spacing: -.02em; margin: 2px 0 4px; }
  .hero-num small { font-size: 18px; font-weight: 700; margin-left: 3px; opacity: .85; }
  .hero-sub { display: block; font-size: 13px; opacity: .9; }
  .hero-ring { position: relative; z-index: 1; flex: none; width: 92px; height: 92px; }
  .hero-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .hero-ring circle { fill: none; stroke-width: 9; }
  .hero-ring .trk { stroke: rgba(255, 255, 255, .22); }
  .hero-ring .prg { stroke: #fff; stroke-linecap: round; stroke-dasharray: 263.9; stroke-dashoffset: 263.9; transition: stroke-dashoffset .9s cubic-bezier(.3, .8, .2, 1); filter: drop-shadow(0 0 5px rgba(255, 255, 255, .55)); }
  .hero-ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; font-weight: 700; }
  .hero.cele .hero-ring { animation: pulse .8s cubic-bezier(.3, 1.4, .5, 1); }
  @keyframes pulse { 0% { transform: scale(1); } 40% { transform: scale(1.14) rotate(6deg); } 100% { transform: scale(1); } }

  main { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }

  /* ---------- add form ---------- */
  .add-wrap { margin: 0 16px 16px; display: flex; flex-direction: column; gap: 8px; }
  .add { display: flex; gap: 8px; }
  .add input[type="text"] {
    flex: 1; min-width: 0; height: 48px; padding: 0 16px;
    border: 0; border-radius: 15px; background: var(--surface); color: var(--ink);
    font-size: 16px; outline: none; box-shadow: var(--shadow);
  }
  .add input[type="text"]::placeholder, .field::placeholder { color: var(--faint); }
  .date-pick {
     position: relative; flex: none; width: 48px; height: 48px; border-radius: 15px;
    background: var(--surface); color: var(--sub); display: grid; place-items: center;
    box-shadow: var(--shadow); transition: color .2s ease, background .2s ease;
  }
  .date-pick.has-val { color: var(--accent); background: rgba(51, 71, 209, .1); }
  .date-pick input[type="date"] {
    position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; border: 0; padding: 0;
  }
  .due-preview {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 12px; border-radius: 10px; background: var(--surface);
    font-size: 13px; color: var(--accent); font-weight: 600; box-shadow: var(--shadow);
  }
  .due-preview button { font-size: 12px; color: var(--sub); padding: 2px 6px; }
  .add button.submit-btn {
    flex: none; width: 48px; height: 48px; border-radius: 15px;
    background: linear-gradient(135deg, var(--accent), #8B5CF6); color: #fff;
    display: grid; place-items: center;
    box-shadow: 0 10px 20px -10px var(--accent);
    transition: transform .18s ease;
  }
  .add button.submit-btn:active { transform: scale(.9) rotate(90deg); }
  .add button.submit-btn.spin { animation: spin .5s cubic-bezier(.3, 1.4, .5, 1); }
  @keyframes spin { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(180deg) scale(1.15); } 100% { transform: rotate(360deg) scale(1); } }
  .add button.submit-btn svg.i { stroke-width: 2.4; }

  /* ---------- list rows ---------- */
  .list { margin: 0 16px; padding: 0; list-style: none; background: var(--surface); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); }
  .row {
    position: relative; overflow: hidden; background: var(--surface);
    transition: height .32s cubic-bezier(.4, 0, .2, 1), opacity .25s ease, transform .25s cubic-bezier(.2, .8, .2, 1), box-shadow .2s ease;
  }
  .row::after { content: ""; position: absolute; left: 52px; right: 0; bottom: 0; height: 1px; background: var(--line); }
  .row:last-child::after { display: none; }
  .row.habit::before { content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 4px; border-radius: 0 4px 4px 0; background: var(--c); opacity: .9; }
  .row.leaving { opacity: 0; transform: translateX(56px) scale(.96); }
  .row.leaving::after { display: none; }
  .row.enter { animation: enter .34s cubic-bezier(.3, 1.3, .5, 1); }
  .row.stagger { animation: rise .45s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(var(--i, 0) * 45ms); }
  @keyframes enter { from { opacity: 0; transform: translateY(-10px) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .rowin { display: flex; align-items: center; min-height: 62px; padding: 4px 6px 4px 4px; }

  /* ---------- drag handle & dragging state ---------- */
  .grip {
    flex: none; width: 32px; height: 52px; display: grid; place-items: center;
    color: var(--faint); touch-action: none;
  }
  .grip svg { width: 18px; height: 18px; fill: currentColor; }
  .grip:active { color: var(--ink); }
  .row.dragging {
    z-index: 30;
    box-shadow: 0 14px 32px rgba(0, 0, 0, .28);
    opacity: .94;
    transition: box-shadow .2s ease, opacity .2s ease;
  }

  .check { flex: none; width: 46px; height: 52px; display: grid; place-items: center; }
  .ring {
    position: relative; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--faint);
    display: grid; place-items: center;
    transition: background .2s ease, border-color .2s ease, box-shadow .3s ease;
  }
  .ring svg { width: 14px; height: 14px; fill: none; stroke: var(--accent-ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .ring path { stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .24s ease .08s; }
  .check.on .ring { background: var(--c); border-color: var(--c); box-shadow: 0 4px 12px -3px var(--c); }
  .check.on .ring path { stroke-dashoffset: 0; }
  .check.pop .ring { animation: popring .38s cubic-bezier(.3, 1.6, .5, 1); }
  .check.pop .ring::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--c); animation: ripple .55s ease-out forwards; }
  @keyframes popring { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 100% { transform: scale(1); } }
  @keyframes ripple { from { transform: scale(1); opacity: .7; } to { transform: scale(1.9); opacity: 0; } }

  .main { flex: 1; min-width: 0; text-align: left; padding: 10px 6px 10px 2px; display: block; border-radius: 12px; transition: background .15s ease; }
  .main:active { background: rgba(120, 130, 170, .12); }
  .name { display: block; font-size: 16px; font-weight: 500; line-height: 1.4; overflow-wrap: anywhere; }
  .txt {
    background: linear-gradient(currentColor, currentColor) no-repeat 0 58% / 0 1.5px;
    transition: background-size .3s ease .1s, color .3s ease;
  }
  .checked .txt { background-size: 100% 1.5px; color: var(--sub); }

  /* ---------- due badge ---------- */
  .due-tag {
    display: inline-flex; align-items: center; gap: 4px;
    margin-top: 5px; padding: 2px 8px; border-radius: 6px;
    font-size: 11px; font-weight: 600; background: var(--bg); color: var(--sub);
  }
  .due-tag svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2; fill: none; }
  .due-tag.soon { background: rgba(217, 119, 6, .14); color: var(--warn); }
  .due-tag.over { background: rgba(214, 69, 61, .14); color: var(--danger); }

  .dots { display: flex; gap: 6px; margin-top: 7px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); transition: background .2s ease; }
  .dots i.d { background: var(--c); animation: dotin .3s cubic-bezier(.3, 1.6, .5, 1); }
  .dots i.t { outline: 1.5px solid var(--faint); outline-offset: 1.5px; }
  .dots i.t.d { outline-color: var(--c); }
  @keyframes dotin { from { transform: scale(.3); } to { transform: scale(1); } }

  .stat { flex: none; text-align: right; padding-left: 6px; }
  .stat b { display: flex; align-items: center; justify-content: flex-end; font-size: 20px; font-weight: 700; line-height: 1; }
  .stat b small { font-size: 11px; font-weight: 500; color: var(--sub); margin-left: 2px; }
  .stat b.up { animation: numup .45s cubic-bezier(.3, 1.6, .5, 1); transform-origin: right center; }
  @keyframes numup { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .stat span { display: block; font-size: 11px; color: var(--sub); margin-top: 5px; }
  .flame { width: 16px; height: 16px; flex: none; margin-right: 2px; fill: var(--faint); transform-origin: 50% 90%; }
  .flame.lit { fill: url(#flameGrad); animation: flick 1.7s ease-in-out infinite; }
  @keyframes flick { 0%, 100% { transform: scale(1, 1) rotate(0); } 30% { transform: scale(1.05, 1.14) rotate(-4deg); } 60% { transform: scale(.97, 1.05) rotate(3deg); } }

  .empty { text-align: center; color: var(--sub); padding: 34px 32px; line-height: 1.8; font-size: 15px; }
  .ill { display: block; width: 76px; height: 76px; margin: 0 auto 12px; color: var(--faint); animation: float 3.4s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

  /* ---------- bottom navigation ---------- */
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--nav);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav .ind { position: absolute; top: -1px; left: 0; width: 25%; height: 3px; transition: transform .4s cubic-bezier(.3, 1.3, .5, 1); }
  nav .ind::after { content: ""; display: block; width: 38px; height: 3px; margin: 0 auto; border-radius: 0 0 4px 4px; background: linear-gradient(90deg, var(--accent), #8B5CF6); box-shadow: 0 4px 12px var(--accent); }
  nav[data-tab="list"] .ind { transform: translateX(100%); }
  nav[data-tab="workout"] .ind { transform: translateX(200%); }
  nav[data-tab="nutrition"] .ind { transform: translateX(300%); }
  nav button {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 9px 0 7px; color: var(--faint);
    font-size: 11px; font-weight: 600; transition: color .25s ease;
  }
  nav button[aria-current="true"] { color: var(--accent); }
  nav button[aria-current="true"] svg { animation: navpop .5s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes navpop { 0% { transform: scale(1); } 40% { transform: scale(1.28) translateY(-3px); } 100% { transform: scale(1); } }

  /* ---------- sheet ---------- */
  .backdrop { position: fixed; inset: 0; z-index: 19; background: rgba(10, 14, 24, .42); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .28s ease; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-height: 88%;
    display: flex; flex-direction: column;
    background: var(--bg); border-radius: 26px 26px 0 0;
    box-shadow: 0 -20px 50px -20px rgba(10, 14, 40, .45);
    padding-bottom: env(safe-area-inset-bottom);
    transform: translateY(105%); transition: transform .36s cubic-bezier(.2, .85, .25, 1);
  }
  .sheet::before { content: ""; align-self: center; width: 38px; height: 5px; margin-top: 8px; border-radius: 3px; background: var(--line); }
  .sheet.open { transform: none; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px 8px; }
  .sheet-head h2 { margin: 0; font-size: 19px; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .link { color: var(--accent); font-size: 16px; font-weight: 600; padding: 6px 0 6px 12px; }
  .sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 16px 20px; }
  .note { margin: 0 4px 12px; font-size: 13px; color: var(--sub); line-height: 1.6; }

  .meta { display: block; font-size: 12px; color: var(--sub); margin-top: 2px; }
  .name.struck { color: var(--sub); text-decoration: line-through; text-decoration-thickness: 1.5px; }
  .pill { flex: none; height: 34px; padding: 0 14px; border-radius: 17px; background: var(--bg); color: var(--accent); font-size: 14px; font-weight: 600; transition: transform .15s ease; }
  .pill:active { transform: scale(.92); }
  .sheet .rowin { padding: 4px 16px; }
  .sheet .row::after { left: 16px; }
  .acts { flex: none; display: flex; gap: 8px; }
  .pill.warn { color: var(--danger); }
  .del { flex: none; width: 38px; height: 40px; border-radius: 12px; color: var(--faint); display: grid; place-items: center; transition: color .15s ease, background .15s ease, transform .15s ease; }
  .del svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .del:active { color: var(--danger); background: rgba(214, 69, 61, .12); transform: scale(.9); }

  .facts { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-radius: 20px; padding: 14px 4px; text-align: center; box-shadow: var(--shadow); }
  .facts b { display: block; font-size: 22px; font-weight: 700; line-height: 1.1; color: var(--c); }
  .facts span { display: block; font-size: 11px; color: var(--sub); margin-top: 5px; }

  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 16px 0 6px; }
  .cal .wd { text-align: center; font-size: 12px; color: var(--sub); padding-bottom: 2px; }
  .c { aspect-ratio: 1; border-radius: 11px; background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; transition: transform .15s ease; }
  .c:active { transform: scale(.88); }
  .c.b { color: var(--faint); }
  .c.f { background: transparent; color: var(--faint); }
  .c.d { background: var(--c); color: var(--accent-ink); font-weight: 700; box-shadow: 0 4px 10px -4px var(--c); }
  .c.t { outline: 2px solid var(--c); outline-offset: 1px; }

  .edit-group { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .edit-row { display: flex; gap: 10px; align-items: center; }
  .edit-label { font-size: 13px; font-weight: 600; color: var(--sub); min-width: 52px; }
  .field {
    flex: 1; min-width: 0; height: 48px; padding: 0 16px; border: 0; border-radius: 15px;
    background: var(--surface); color: var(--ink); font-size: 16px; outline: none;
  }
  .primary { flex: none; height: 48px; padding: 0 22px; border-radius: 15px; background: linear-gradient(135deg, var(--accent), #8B5CF6); color: #fff; font-size: 16px; font-weight: 700; transition: transform .15s ease; }
  .primary:active { transform: scale(.94); }
  .danger { width: 100%; height: 48px; margin-top: 12px; border-radius: 14px; color: var(--danger); font-size: 16px; font-weight: 600; }
  .hint { margin: 10px 4px 0; font-size: 12px; color: var(--sub); }

  /* ---------- effects layer & toast ---------- */
  #fx { position: fixed; inset: 0; z-index: 40; pointer-events: none; overflow: hidden; }
  #fx .pt, #fx .fly { position: absolute; }
  #fx .fly { width: 18px; height: 18px; border-radius: 50%; margin: -9px 0 0 -9px; box-shadow: 0 0 14px currentColor; }
  .toast {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 10px); z-index: 50;
    display: flex; align-items: center; gap: 8px; max-width: 90vw;
    padding: 11px 18px; border-radius: 24px;
    background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 700;
    box-shadow: 0 14px 30px -12px rgba(0, 0, 0, .5);
    transform: translate(-50%, -190%); transition: transform .5s cubic-bezier(.3, 1.4, .5, 1);
    pointer-events: none;
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast svg { width: 16px; height: 16px; flex: none; fill: #FFC83D; }
  .toast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .toast button { flex: none; border-radius: 14px; margin-left: 4px; padding: 5px 12px; background: rgba(127, 127, 127, .32); font-size: 13px; font-weight: 700; }

  /* ---------- 筋トレタブ ---------- */
  :root { --fig: #3347D1; --stage: #F1F4FF; --hl: #FF6B4A; --eq: #AEB6C9; --eqfill: #D6DBE8; }
  @media (prefers-color-scheme: dark) {

  }
  .wk-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 0 16px 16px; }
  .wk-day {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 10px 0 9px; border: 0; border-radius: 15px;
    background: var(--surface); box-shadow: var(--shadow);
    color: var(--sub); font-size: 15px; font-weight: 700;
    transition: transform .2s ease, background .25s ease, color .25s ease;
  }
  .wk-day:active { transform: scale(.92); }

  .wk-day.has i { opacity: .85; }

  .wk-day.sel { background: linear-gradient(135deg, #3A4FE0, #8B5CF6); color: #fff; box-shadow: 0 10px 20px -10px #5B4DE6; transform: translateY(-2px); }
  .wk-day.sel i { background: #fff; }
  .wk-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 22px 12px; }

  .wk-head span { font-size: 13px; font-weight: 600; color: var(--sub); text-align: right; }

  .ex { margin: 0 16px 18px; background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; padding-bottom: 8px; }
  .ex.stagger { animation: rise .5s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(var(--i, 0) * 90ms); }
  .ex-top { display: flex; align-items: center; gap: 12px; padding: 16px 2px 4px 16px; }
  .ex-no { flex: none; width: 32px; height: 32px; border-radius: 11px; display: grid; place-items: center; background: linear-gradient(135deg, #3A4FE0, #8B5CF6); color: #fff; font-size: 15px; font-weight: 800; }
  .ex-title { flex: 1; min-width: 0; }
  .ex-title h3 { margin: 0; font-size: 17px; font-weight: 800; line-height: 1.35; }
  .ex-title p { margin: 2px 0 0; font-size: 12px; color: var(--sub); }
  .ex-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 16px 12px; }
  .chip { padding: 4px 10px; border-radius: 12px; background: var(--bg); font-size: 12px; font-weight: 700; }
  .chip.sets { background: rgba(51, 71, 209, .13); color: var(--accent); }
  .chip.place { color: var(--sub); }

  .stage { position: relative; margin: 0 12px; border-radius: 18px; background: var(--stage); overflow: hidden; cursor: pointer; }
  .stage-svg svg { display: block; width: 100%; max-height: 300px; }
  .stage::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 25% 15%, rgba(255, 255, 255, .5), transparent 60%); pointer-events: none; }
  @media (prefers-color-scheme: dark) { .stage::before { background: radial-gradient(circle at 25% 15%, rgba(124, 140, 255, .14), transparent 60%); } }
  .capbar { position: relative; display: flex; align-items: center; gap: 10px; padding: 4px 10px 12px; }
  .cap { flex: 1; min-width: 0; min-height: 34px; display: flex; align-items: center; padding: 6px 13px; border-radius: 15px; background: rgba(25, 32, 46, .86); color: #fff; font-size: 12px; font-weight: 700; line-height: 1.4; }
  .pp { flex: none; width: 34px; height: 34px; border-radius: 50%; background: rgba(25, 32, 46, .86); color: #fff; display: grid; place-items: center; }
  .pp svg { grid-area: 1 / 1; width: 16px; height: 16px; stroke: currentColor; stroke-width: 3; stroke-linecap: round; fill: currentColor; }
  .pp .ic-pause { fill: none; }
  .pp .ic-play { display: none; }
  .stage.paused .ic-pause { display: none; }
  .stage.paused .ic-play { display: block; }
  @media (prefers-color-scheme: dark) { .cap { background: rgba(124, 140, 255, .2); } .pp { background: rgba(124, 140, 255, .28); } }
  .prog { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: linear-gradient(90deg, #3A4FE0, #8B5CF6); }

  .fig .eql { stroke: var(--eq); stroke-width: 3; stroke-linecap: round; fill: none; }
  .fig .eqb { stroke: var(--sub); stroke-width: 7; stroke-linecap: round; opacity: .75; }
  .fig .eqf { fill: var(--eqfill); stroke: var(--eq); stroke-width: 2; }
  .fig .eqk { fill: var(--sub); }
  .fig .towel { stroke: #E0488B; stroke-width: 4; stroke-linecap: round; }
  .fig .towel.far { opacity: .45; }
  .fig .limb { fill: none; stroke: var(--fig); stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
  .fig .limb.far { opacity: .5; }
  .fig.fo .limb.far { opacity: .8; }
  .fig .torso { stroke-width: 18; }
  .fig .neck { stroke-width: 8; }
  .fig .head { fill: var(--fig); }
  .fig .hl { fill: var(--hl); opacity: .45; animation: hlpulse 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes hlpulse { 0%, 100% { opacity: .28; transform: scale(.9); } 50% { opacity: .62; transform: scale(1.12); } }
  .fig .insbg { fill: var(--surface); stroke: var(--eq); stroke-width: 1.5; opacity: .95; }
  .fig .insb { fill: var(--eq); }
  .fig .insh { fill: var(--hl); }
  .fig .insl { stroke: var(--eq); stroke-width: 2; stroke-linecap: round; }
  .fig .inst { fill: var(--sub); font-size: 8.5px; font-weight: 700; }

  .ex-note { margin: 10px 18px 0; padding: 8px 12px; border-radius: 12px; background: var(--bg); color: var(--sub); font-size: 12px; line-height: 1.6; }
  .ex-lead { margin: 14px 18px 8px; font-size: 14px; line-height: 1.75; color: var(--sub); }
  .ex-muscles { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 18px 4px; }
  .ex-muscles span { padding: 4px 10px; border-radius: 12px; background: rgba(255, 107, 74, .13); color: #D9482B; font-size: 12px; font-weight: 700; }
  @media (prefers-color-scheme: dark) { .ex-muscles span { color: #FF9C84; } }
  .ex-safety { margin: 12px 16px 0; padding: 12px 14px; border-radius: 14px; background: rgba(217, 119, 6, .13); }
  .ex-safety b { display: block; font-size: 13px; color: var(--warn); margin-bottom: 4px; }
  .ex-safety p { margin: 0; font-size: 13px; line-height: 1.7; }
  .ex-sec { padding: 4px 18px 2px; }
  .ex-sec h4 { margin: 14px 0 10px; font-size: 13px; font-weight: 800; letter-spacing: .04em; color: var(--accent); }
  .steps { margin: 0; padding: 0; list-style: none; counter-reset: s; }
  .steps li { position: relative; padding: 0 0 12px 34px; font-size: 14px; line-height: 1.75; counter-increment: s; }
  .steps li::before { content: counter(s); position: absolute; left: 0; top: 1px; width: 23px; height: 23px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 800; display: grid; place-items: center; }
  .more { margin: 4px 12px 0; border-radius: 16px; background: var(--bg); }
  .more summary { list-style: none; padding: 13px 16px; font-size: 14px; font-weight: 700; color: var(--accent); cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
  .more summary::-webkit-details-marker { display: none; }
  .more summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg) translateY(-2px); transition: transform .25s ease; }
  .more[open] summary::after { transform: rotate(-135deg) translateY(-2px); }
  .more[open] > .ex-sec { animation: rise .35s ease backwards; }
  .more .ex-sec:last-child { padding-bottom: 12px; }
  .pts { margin: 0; padding: 0; list-style: none; }
  .pts li { position: relative; padding: 0 0 9px 22px; font-size: 14px; line-height: 1.7; }
  .pts li::before { position: absolute; left: 0; top: 0; font-weight: 800; }
  .pts.ok li::before { content: "✓"; color: #2E9B5A; }
  .pts.ng li::before { content: "✕"; color: var(--danger); }
  .arr { margin: 0 0 8px; font-size: 14px; line-height: 1.7; }
  .arr b { display: block; font-size: 12px; color: var(--sub); }

  .rest { margin: 4px 16px 0; padding: 26px 20px 22px; border-radius: 26px; text-align: center; background: var(--surface); box-shadow: var(--shadow); }
  .rest-ill { width: 78%; max-width: 280px; height: auto; margin: 0 auto 6px; display: block; overflow: visible; }
  .rest-ill .moon { fill: #FFD66B; filter: drop-shadow(0 0 10px rgba(255, 214, 107, .6)); animation: moonbob 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .rest-ill .stars path { fill: #FFC83D; animation: twinkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .rest-ill .stars path:nth-child(2) { animation-delay: .8s; }
  .rest-ill .stars path:nth-child(3) { animation-delay: 1.5s; }
  .rest-ill .z { fill: var(--accent); font-weight: 800; font-size: 22px; animation: zfloat 3.2s ease-in-out infinite; opacity: 0; }
  .rest-ill .z2 { font-size: 17px; animation-delay: .9s; } .rest-ill .z3 { font-size: 13px; animation-delay: 1.8s; }
  .rest-ill .bw { fill: var(--accent); }
  .rest-ill .rice { fill: #fff; stroke: var(--line); stroke-width: 2; }
  .rest-ill .steam { fill: none; stroke: var(--faint); stroke-width: 3; stroke-linecap: round; opacity: 0; animation: steam 2.8s ease-in-out infinite; }
  .rest-ill .s2 { animation-delay: .6s; } .rest-ill .s3 { animation-delay: 1.2s; }
  @keyframes moonbob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-5px) rotate(4deg); } }
  @keyframes twinkle { 0%, 100% { opacity: .3; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.15); } }
  @keyframes zfloat { 0% { opacity: 0; transform: translate(-6px, 8px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(10px, -14px); } }
  @keyframes steam { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: .8; } 100% { opacity: 0; transform: translateY(-8px); } }
  .rest h2 { margin: 6px 0 8px; font-size: 22px; font-weight: 800; line-height: 1.5; }
  .rest h2 span { display: inline-block; }
  .rest-sub { margin: 0 0 18px; font-size: 13px; line-height: 1.7; color: var(--sub); }
  .rest-tips { margin: 0; padding: 0; list-style: none; text-align: left; display: grid; gap: 10px; }
  .rest-tips li { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 16px; background: var(--bg); font-size: 13px; line-height: 1.7; }
  .rest-tips b { flex: none; min-width: 42px; padding: 2px 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); text-align: center; font-size: 12px; }
  .rest-next { margin: 16px 0 0; font-size: 13px; color: var(--sub); }
  .rest-next b { color: var(--ink); }

  /* ---------- メニュー選択・セット/回数/休憩 ---------- */
  .tag-rec { display: inline-block; margin-left: 7px; padding: 2px 8px; border-radius: 9px; background: linear-gradient(135deg, #FFB020, #FF7A00); color: #fff; font-size: 10px; font-weight: 800; font-style: normal; vertical-align: 2px; letter-spacing: .04em; }
  .wk-menu { display: flex; align-items: center; gap: 12px; width: calc(100% - 32px); margin: 0 16px 14px; padding: 12px 14px; border: 0; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); text-align: left; transition: transform .15s ease; }
  .wk-menu:active { transform: scale(.98); }
  .wm-ic { flex: none; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, #3A4FE0, #8B5CF6); color: #fff; }

  .wm-t b { font-size: 16px; font-weight: 800; line-height: 1.4; }
  .wm-go { flex: none; padding: 6px 12px; border-radius: 14px; background: var(--bg); color: var(--accent); font-size: 13px; font-weight: 700; }

  .cfgbox { padding: 4px 16px 12px; }
  .cfg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stp { padding: 8px 6px 8px; border-radius: 15px; background: var(--bg); text-align: center; }
  .stp-l { display: block; margin-bottom: 5px; font-size: 11px; font-weight: 700; color: var(--sub); white-space: nowrap; }

  .stp-c button { width: 100%; height: 34px; padding: 0; border: 0; border-radius: 11px; background: var(--surface); color: var(--accent); font-size: 20px; font-weight: 700; line-height: 1; box-shadow: 0 2px 6px -2px rgba(40, 50, 110, .3); transition: transform .12s ease; }

  .stp-c b small { margin-left: 1px; font-size: 11px; font-weight: 700; color: var(--sub); }
  .cfg-hint { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 9px 2px 0; font-size: 11.5px; line-height: 1.5; color: var(--sub); }
  .cfg-reset { flex: none; padding: 4px 0 4px 6px; border: 0; background: none; color: var(--accent); font-size: 12px; font-weight: 700; }

  .mn { position: relative; display: block; width: 100%; margin: 0 0 12px; padding: 16px 50px 15px 16px; border: 2px solid transparent; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); text-align: left; transition: border-color .2s ease, transform .15s ease; }
  .mn:active { transform: scale(.985); }
  .mn.sel { border-color: var(--accent); }
  .mn > span { display: block; }
  .mn-ck { position: absolute; right: 14px; top: 16px; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--faint); display: grid !important; place-items: center; transition: background .2s ease, border-color .2s ease; }
  .mn-ck svg { width: 14px; height: 14px; fill: none; stroke: var(--accent-ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
  .mn.sel .mn-ck { background: var(--accent); border-color: var(--accent); }
  .mn.sel .mn-ck svg { opacity: 1; }
  .mn-top b { font-size: 17px; font-weight: 800; }
  .mn-meta { margin-top: 5px; font-size: 12px; color: var(--sub); }
  .mn-meta .lv { margin-right: 8px; padding: 2px 8px; border-radius: 9px; background: rgba(51, 71, 209, .13); color: var(--accent); font-size: 11px; font-weight: 800; font-style: normal; }
  .mn-desc { margin-top: 8px; font-size: 13px; line-height: 1.65; }
  .mn-ex { display: flex !important; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
  .mn-ex i { padding: 3px 9px; border-radius: 10px; background: var(--bg); color: var(--sub); font-size: 11px; font-weight: 600; font-style: normal; }
  .mn-gear { margin-top: 9px; font-size: 12px; color: var(--sub); }

  /* ---------- 4タブ・タイマー・自作メニュー・栄養 ---------- */
  .wk-top { display: flex; gap: 10px; margin: 0 16px 14px; }
  .wk-top .wk-menu { flex: 1; min-width: 0; width: auto; margin: 0; }
  .wk-tbtn { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 70px; padding: 6px 0; border: 0; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); color: var(--accent); font-size: 11px; font-weight: 800; transition: transform .15s ease; }

  .setrow { display: flex; align-items: center; gap: 10px; padding: 0 16px 12px; }

  .primary.wide { display: block; width: 100%; margin-top: 16px; }

  <div class="tm-btns">
    <button type="button" id="tm-pause" data-act="tm-pause" aria-label="一時停止"><svg class="ic-p" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg><svg class="ic-r" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg></button>
    <button type="button" data-act="tm-add" aria-label="15秒たす">+15</button>
    <button type="button" data-act="tm-close" aria-label="止める"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
</div>

<div class="backdrop" id="backdrop" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div id="fx" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  /* ---------- ホーム画面アイコン自動生成 ---------- */
  function setupAppIcons() {
    try {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      const g = ctx.createLinearGradient(0, 0, 512, 512);
      g.addColorStop(0, '#3A4FE0');
      g.addColorStop(1, '#8B5CF6');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.roundRect(0, 0, 512, 512, 115);
      ctx.fill();

      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 46;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(145, 265);
      ctx.lineTo(225, 345);
      ctx.lineTo(375, 175);
      ctx.stroke();

      const iconUrl = c.toDataURL('image/png');
      const appleLink = document.createElement('link');
      appleLink.rel = 'apple-touch-icon';
      appleLink.href = iconUrl;
      document.head.appendChild(appleLink);

      const favLink = document.createElement('link');
      favLink.rel = 'icon';
      favLink.type = 'image/png';
      favLink.href = iconUrl;
      document.head.appendChild(favLink);

      const manifest = {
        name: 'Todo',
        short_name: 'Todo',
        display: 'standalone',
        background_color: '#0F131C',
        theme_color: '#3347D1',
        icons: [{ src: iconUrl, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }]
      };
      const mLink = document.createElement('link');
      mLink.rel = 'manifest';
      mLink.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
      document.head.appendChild(mLink);
    } catch (e) {}
  }
  setupAppIcons();

  /* ---------- utils ---------- */
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = n => String(n).padStart(2, '0');
  const key = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); };
  const addDays = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return key(d); };
  const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
  const todayKey = () => key(new Date());
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const DAY = 86400000;
  const KEEP = 7 * DAY;
  const WEEKDAYS = '日月火水木金土';
  const MILES = [3, 7, 14, 30, 60, 100, 200, 365];
  const CONFETTI = ['#3347D1', '#8B5CF6', '#0E9F9A', '#E0488B', '#E8730C', '#2E9B5A', '#FFC83D'];
  const cssVar = (el, name) => getComputedStyle(el).getPropertyValue(name).trim() || '#3347D1';
  const hash = s => { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; };
  const hIdx = h => (typeof h.c === 'number' ? h.c : hash(h.id)) % 6;

  /* ---------- state ---------- */
  const KEY = 'todo-app-v1';
  let state = load();
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && typeof s === 'object') {
        return {
          tab: ['list', 'workout', 'nutrition'].includes(s.tab) ? s.tab : 'daily',
          wk: s.wk && typeof s.wk === 'object' ? s.wk : {},
          wkMenu: typeof s.wkMenu === 'string' ? s.wkMenu : 'rec',
          wkCfg: s.wkCfg && typeof s.wkCfg === 'object' ? s.wkCfg : {},
          wkSets: s.wkSets && typeof s.wkSets === 'object' ? s.wkSets : {},
          wkEx: s.wkEx && typeof s.wkEx === 'object' ? s.wkEx : {},
          wkCustom: Array.isArray(s.wkCustom) ? s.wkCustom : [],
          nut: Object.assign({ sex: 'm', age: '', height: '', weight: '', act: 1.55, goal: 'keep' }, s.nut && typeof s.nut === 'object' ? s.nut : {}),
          snd: s.snd !== false,
          wkTs: s.wkTs && typeof s.wkTs === 'object' ? s.wkTs : {},
          gh: Object.assign({ clientId: '', token: '', exp: 0, data: null, useMeasured: false }, s.gh && typeof s.gh === 'object' ? s.gh : {}),
          habits: Array.isArray(s.habits) ? s.habits : [],
          todos: Array.isArray(s.todos) ? s.todos : [],
          done: Array.isArray(s.done) ? s.done : []
        };
      }
    } catch (e) {}
    return { tab: 'daily', wk: {}, wkMenu: 'rec', wkCfg: {}, wkSets: {}, wkEx: {}, wkCustom: [], nut: { sex: 'm', age: '', height: '', weight: '', act: 1.55, goal: 'keep' }, snd: true, wkTs: {}, gh: { clientId: '', token: '', exp: 0, data: null, useMeasured: false }, habits: [], todos: [], done: [] };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function purge() {
    const now = Date.now();
    const before = state.done.length;
    state.done = state.done.filter(t => now - t.at < KEEP);
    if (state.done.length !== before) { save(); return true; }
    return false;
  }

  /* ---------- habit stats ---------- */
  function stats(h) {
    const today = todayKey();
    const doneToday = !!h.log[today];
    let cur = doneToday ? today : addDays(today, -1), streak = 0;
    while (h.log[cur]) { streak++; cur = addDays(cur, -1); }
    const keys = Object.keys(h.log).sort();
    let best = 0, run = 0, prev = null;
    for (const k of keys) {
      run = prev && addDays(prev, 1) === k ? run + 1 : 1;
      if (run > best) best = run;
      prev = k;
    }
    const count = keys.filter(k => k >= h.created && k <= today).length;
    let total = diffDays(h.created, today) + 1;
    if (!doneToday) total -= 1;
    const rate = total > 0 ? Math.min(100, Math.round(count / total * 100)) : null;
    return { streak, best, count, rate };
  }

  /* ---------- due date helper ---------- */
  function formatDue(dueStr) {
    if (!dueStr) return '';
    const t = todayKey();
    const diff = diffDays(t, dueStr);
    const d = parse(dueStr);
    const dateLabel = `${d.getMonth() + 1}/${d.getDate()}(${WEEKDAYS[d.getDay()]})`;
    let cls = '', text = dateLabel;
    if (diff < 0) {
      cls = 'over';
      text = `期限切れ ${dateLabel}`;
    } else if (diff === 0) {
      cls = 'soon';
      text = `今日まで`;
    } else if (diff === 1) {
      cls = 'soon';
      text = `明日まで`;
    } else if (diff <= 3) {
      cls = 'soon';
      text = `あと${diff}日 (${dateLabel})`;
    } else {
      text = `${dateLabel}まで`;
    }
    return `<span class="due-tag ${cls}"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>${esc(text)}</span>`;
  }

  /* ---------- effects ---------- */
  const fx = $('#fx');

  function burst(x, y, color, n, dist, o) {
    o = o || {};
    for (let i = 0; i < n; i++) {
      const p = document.createElement('span');
      p.className = 'pt';
      const size = o.size || (5 + Math.random() * 4);
      const col = Array.isArray(color) ? color[i % color.length] : color;
      p.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px;background:${col};border-radius:${Math.random() < .5 ? '50%' : '2px'}`;
      fx.appendChild(p);
      const ang = (Math.PI * 2 * i / n) + Math.random() * .6;
      const d = dist * (.65 + Math.random() * .7);
      const dx = Math.cos(ang) * d, dy = Math.sin(ang) * d, g = o.gravity || 0;
      const rot = (Math.random() - .5) * 420;
      const a = p.animate([
        { transform: 'translate(-50%,-50%) translate(0,0) scale(1) rotate(0deg)', opacity: 1 },
        { transform: `translate(-50%,-50%) translate(${dx}px,${dy}px) scale(1) rotate(${rot / 2}deg)`, opacity: 1, offset: .6 },
        { transform: `translate(-50%,-50%) translate(${dx * 1.15}px,${dy * 1.15 + g}px) scale(.3) rotate(${rot}deg)`, opacity: 0 }
      ], { duration: (o.dur || 650) + Math.random() * 250, easing: 'cubic-bezier(.2,.7,.3,1)' });
      a.onfinish = () => p.remove();
    }
  }

  function flyTo(fromRect, toEl, color, done) {
    const b = toEl.getBoundingClientRect();
    const sx = fromRect.left + fromRect.width / 2, sy = fromRect.top + fromRect.height / 2;
    const dx = b.left + b.width / 2 - sx, dy = b.top + b.height / 2 - sy;
    const d = document.createElement('span');
    d.className = 'fly';
    d.style.cssText = `left:${sx}px;top:${sy}px;background:${color};color:${color}`;
    fx.appendChild(d);
    const a = d.animate([
      { transform: 'translate(0,0) scale(1)', opacity: 1 },
      { transform: `translate(${dx * .45}px,${dy * .45 - 36}px) scale(1.2)`, opacity: 1, offset: .45 },
      { transform: `translate(${dx}px,${dy}px) scale(.35)`, opacity: .3 }
    ], { duration: 640, easing: 'cubic-bezier(.5,0,.3,1)' });
    a.onfinish = () => { d.remove(); done && done(); };
  }

  function celebrate() {
    const hero = $('#hero');
    hero.classList.remove('cele'); void hero.offsetWidth; hero.classList.add('cele');
    const r = $('.hero-ring').getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, CONFETTI, 32, 130, { gravity: 150, dur: 1100, size: 8 });
    setTimeout(() => burst(r.left + r.width / 2 - 70, r.top + r.height / 2, CONFETTI, 18, 90, { gravity: 120, dur: 1000, size: 7 }), 160);
  }

  let toastTimer = 0;
  function toast(msg, action) {
    const t = $('#toast');
    const icon = action ? '' : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.4 6.4 6.6.5-5.1 4.3 1.7 6.6L12 16.6l-5.6 3.7 1.7-6.6L3 9.4l6.6-.5z"/></svg>';
    t.innerHTML = `${icon}<span>${esc(msg)}</span>${action ? `<button type="button" data-act="${action.name}">${esc(action.label)}</button>` : ''}`;
    t.classList.toggle('act', !!action);
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), action ? 5000 : 2400);
  }
  function hideToast() { clearTimeout(toastTimer); $('#toast').classList.remove('show'); }

  /* ---------- rendering ---------- */
  const RING = '<span class="ring"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 5"/></svg></span>';
  const FLAME = '<svg class="flame%CLS%" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 3.6 5.2 5.6 5.2 10.6a5.2 5.2 0 01-10.4 0c0-2.1 1-3.7 2.1-4.8.3 1.3 1 2.1 2.1 2.3C10.8 8.2 10.8 5.2 12 2z"/></svg>';
  const GRIP = '<div class="grip" aria-label="並び替え"><svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></div>';

  function dotsHtml(h) {
    const t = todayKey();
    return [...Array(7)].map((_, i) => addDays(t, i - 6)).map(d => `<i class="${h.log[d] ? 'd ' : ''}${d === t ? 't' : ''}"></i>`).join('');
  }
  function statHtml(h) {
    const s = stats(h), lit = !!h.log[todayKey()];
    const flame = s.streak > 0 ? FLAME.replace('%CLS%', lit ? ' lit' : '') : '';
    return `<b>${flame}${s.streak}<small>日連続</small></b><span>継続率 ${s.rate == null ? '–' : s.rate + '%'}</span>`;
  }

  function renderBadge(bump) {
    const b = $('#badge');
    b.hidden = state.done.length === 0;
    b.textContent = state.done.length;
    if (bump && !b.hidden) {
      b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump');
      const btn = $('#doneBtn');
      btn.classList.remove('catch'); void btn.offsetWidth; btn.classList.add('catch');
    }
  }

  let heroNum = 0, heroRaf = 0;
  function setHeroNum(v, suffix) { heroNum = v; $('#hero-num').innerHTML = `${v}<small>${suffix}</small>`; }
  function tweenHero(to, suffix) {
    cancelAnimationFrame(heroRaf);
    const from = heroNum;
    if (from === to) { setHeroNum(to, suffix); return; }
    const t0 = performance.now(), dur = 650;
    const step = now => {
      const k = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - k, 3);
      setHeroNum(Math.round(from + (to - from) * e), suffix);
      if (k < 1) heroRaf = requestAnimationFrame(step);
    };
    heroRaf = requestAnimationFrame(step);
  }

  function renderHero() {
    if (state.tab === 'workout') return renderWorkoutHero();
    if (state.tab === 'nutrition') return renderNutHero();
    const daily = state.tab === 'daily';
    let label, val, suffix, sub, p, frac, complete = false;
    if (daily) {
      const t = todayKey();
      const total = state.habits.length;
      const done = state.habits.filter(h => h.log[t]).length;
      const best = state.habits.reduce((m, h) => Math.max(m, stats(h).streak), 0);
      p = total ? done / total : 0;
      val = Math.round(p * 100); suffix = '%'; label = '今日の達成';
      frac = total ? `${done}/${total}` : '–';
      complete = total > 0 && done === total;
      sub = !total ? '習慣を追加してはじめましょう'
        : complete ? 'すべて達成！'
        : best > 0 ? `最長の連続 ${best}日` : '最初の1つをチェックしよう';
    } else {
      const start = new Date(); start.setHours(0, 0, 0, 0);
      const doneToday = state.done.filter(x => x.at >= start.getTime()).length;
      const remain = state.todos.length, all = remain + doneToday;
      p = all ? doneToday / all : 0;
      val = remain; suffix = '件'; label = '残りのタスク';
      frac = all ? `${doneToday}/${all}` : '–';
      complete = remain === 0 && doneToday > 0;
      sub = complete ? 'すべて完了！' : doneToday ? `今日 ${doneToday}件 完了` : remain ? 'チェックして片づけよう' : 'タスクを追加しましょう';
    }
    $('#hero-label').textContent = label;
    $('#hero-sub').textContent = sub;
    $('#hero-frac').textContent = frac;
    $('#hero-prg').style.strokeDashoffset = String(263.9 * (1 - p));
    tweenHero(val, suffix);
    return complete;
  }

  function renderHeader(skipBadge) {
    const n = new Date();
    $('#title').textContent = { daily: '毎日のTodo', list: 'Todoリスト', workout: '今日の筋トレ', nutrition: '栄養' }[state.tab];
    $('#doneBtn').hidden = state.tab === 'workout' || state.tab === 'nutrition';
    $('#sub').textContent = `${n.getMonth() + 1}月${n.getDate()}日 ${WEEKDAYS[n.getDay()]}曜日`;
    renderHero();
    if (!skipBadge) renderBadge(false);
  }

  function renderHabits(anim) {
    $('#habits').innerHTML = state.habits.map((h, i) => {
      const on = !!h.log[todayKey()];
      return `<li class="row habit h${hIdx(h)}${anim ? ' stagger' : ''}" style="--i:${Math.min(i, 10)}" data-id="${h.id}"><div class="rowin">
        ${GRIP}
        <button class="check${on ? ' on' : ''}" data-act="toggle-habit" aria-pressed="${on}" aria-label="${esc(h.name)}">${RING}</button>
        <button class="main" data-act="open-habit">
          <span class="name">${esc(h.name)}</span>
          <span class="dots">${dotsHtml(h)}</span>
        </button>
        <div class="stat">${statHtml(h)}</div>
      </div></li>`;
    }).join('');
    $('#habits').hidden = state.habits.length === 0;
    $('#empty-daily').hidden = state.habits.length !== 0;
  }

  function renderTodos(anim) {
    $('#todos').innerHTML = state.todos.map((t, i) => `<li class="row${anim ? ' stagger' : ''}" style="--i:${Math.min(i, 10)}" data-id="${t.id}"><div class="rowin">
        ${GRIP}
        <button class="check" data-act="done-todo" aria-label="${esc(t.text)}を完了にする">${RING}</button>
        <button class="main" data-act="edit-todo">
          <span class="name"><span class="txt">${esc(t.text)}</span></span>
          ${formatDue(t.due)}
        </button>
        <button class="del" data-act="delete-row" aria-label="${esc(t.text)}を削除"><svg viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.8h5V7M6.5 7l.8 12a1.6 1.6 0 001.6 1.5h6.2a1.6 1.6 0 001.6-1.5l.8-12M10 11v6M14 11v6"/></svg></button>
      </div></li>`).join('');
    syncTodoEmpty();
  }
  function syncTodoEmpty() {
    const has = $('#todos').children.length > 0;
    $('#todos').hidden = !has;
    $('#empty-list').hidden = has;
  }

  function showTab() {
    $('#view-daily').hidden = state.tab !== 'daily';
    $('#view-list').hidden = state.tab !== 'list';
    $('#view-workout').hidden = state.tab !== 'workout';
    $('#view-nutrition').hidden = state.tab !== 'nutrition';
    $('nav').dataset.tab = state.tab;
    syncWorkoutAnim();
    document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', String(b.dataset.tab === state.tab)));
  }

  function render() {
    purge();
    renderHeader();
    renderHabits(state.tab === 'daily');
    renderTodos(state.tab === 'list');
    renderWorkout(state.tab === 'workout');
    renderNutrition();
    showTab();
  }

  /* ---------- タッチドラッグ並び替え ---------- */
  function initSortable(listEl, getArr) {
    let dragEl = null, startY = 0, currentY = 0, origIdx = -1, rows = [], rects = [];

    listEl.addEventListener('touchstart', e => {
      const grip = e.target.closest('.grip');
      if (!grip) return;
      const row = grip.closest('.row');
      if (!row || listEl.children.length < 2) return;

      e.preventDefault();
      dragEl = row;
      rows = [...listEl.querySelectorAll('.row')];
      origIdx = rows.indexOf(dragEl);
      rects = rows.map(r => r.getBoundingClientRect());
      startY = e.touches[0].clientY;
      currentY = startY;

      dragEl.classList.add('dragging');
      if (navigator.vibrate) navigator.vibrate(15);
    }, { passive: false });

    listEl.addEventListener('touchmove', e => {
      if (!dragEl) return;
      e.preventDefault();
      currentY = e.touches[0].clientY;
      const dy = currentY - startY;
      dragEl.style.transform = `translate3d(0, ${dy}px, 0) scale(1.02)`;

      const dragCenter = rects[origIdx].top + rects[origIdx].height / 2 + dy;
      const dragH = rects[origIdx].height;

      rows.forEach((r, i) => {
        if (r === dragEl) return;
        const c = rects[i].top + rects[i].height / 2;
        let shift = 0;
        if (i < origIdx && dragCenter < c) shift = dragH;
        else if (i > origIdx && dragCenter > c) shift = -dragH;
        r.style.transform = shift ? `translate3d(0, ${shift}px, 0)` : '';
      });
    }, { passive: false });

    const endDrag = () => {
      if (!dragEl) return;
      const dy = currentY - startY;
      const dragCenter = rects[origIdx].top + rects[origIdx].height / 2 + dy;
      let newIdx = origIdx;

      for (let i = 0; i < rows.length; i++) {
        if (i === origIdx) continue;
        const c = rects[i].top + rects[i].height / 2;
        if (i < origIdx && dragCenter < c) { newIdx = i; break; }
        if (i > origIdx && dragCenter > c) { newIdx = i; }
      }

      rows.forEach(r => {
        r.style.transform = '';
        r.classList.remove('dragging');
      });
      dragEl = null;

      if (newIdx !== origIdx) {
        const arr = getArr();
        const [moved] = arr.splice(origIdx, 1);
        arr.splice(newIdx, 0, moved);
        save();
        if (listEl.id === 'habits') renderHabits(false);
        else renderTodos(false);
      }
    };

    listEl.addEventListener('touchend', endDrag);
    listEl.addEventListener('touchcancel', endDrag);
  }

  initSortable($('#habits'), () => state.habits);
  initSortable($('#todos'), () => state.todos);

  /* ---------- 筋トレタブ：骨格アニメーション ---------- */
  const prefersReduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const WK = (() => {
    const L = { tor: 58, ua: 32, fa: 32, th: 44, sh: 44, neck: 7, hr: 10 };
    const rad = d => d * Math.PI / 180;
    const deg = r => r * 180 / Math.PI;
    const lerp = (a, b, t) => a + (b - a) * t;
    const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

    // 2関節IK。s=+1/-1 で曲がる向きを固定（腕:+1=肘が後ろ、脚:-1=膝が前）
    function ik(r, t, l1, l2, s) {
      const dx = t[0] - r[0], dy = t[1] - r[1];
      let d = Math.hypot(dx, dy) || .001;
      const ux = dx / d, uy = dy / d;
      const max = l1 + l2 - .01, min = Math.abs(l1 - l2) + .5;
      if (d > max) d = max; if (d < min) d = min;
      const a = Math.atan2(dy, dx);
      const cosA = (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d);
      const A = Math.acos(Math.max(-1, Math.min(1, cosA)));

  const wkNames = '日月火水木金土';

  }
  function syncCustomEx() {
    Object.keys(EX).forEach(k => { if (EX[k].custom) delete EX[k]; });
    Object.values(state.wkEx || {}).forEach(c => { EX[c.id] = customToEx(c); });
  }

      const days = {};
      Object.keys(m.days || {}).forEach(d => {

      });
      MENUS['u_' + m.id] = { name: m.name, level: 'じぶん', desc: 'じぶんで組んだメニューです。', gear: '', custom: true, id: m.id, days };
    });
  }
  function pruneWk() {
    const lim = key(new Date(Date.now() - 30 * 86400000));

  }
  syncCustomEx(); syncCustomMenus(); pruneWk();

  const curMenuId = () => MENUS[state.wkMenu] ? state.wkMenu : 'rec';
  const curMenu = () => MENUS[curMenuId()];
  const wkSession = d => curMenu().days[d] || null;
  let wkSel = new Date().getDay(), wkSelDay = todayKey();
  let wkFigs = {}, wkRaf = 0, wkLast = 0;

  function wkDone(sess) {
    const arr = state.wk[todayKey()] || [];
    return sess ? arr.filter(id => sess.ex.includes(id)).length : 0;
  }

  /* ---- セット・回数・休憩（メニューごとに保存） ---- */
  const recOf = id => { const e = EX[id], o = (curMenu().over || {})[id]; return Object.assign({ sets: e.sets, reps: e.reps, rest: e.rest }, o || {}); };
  const recHint = id => { const e = EX[id], o = (curMenu().over || {})[id]; return o ? `${o.reps}${isSec(e) ? '秒' : '回'}` : e.hint; };
  const cfgKey = id => curMenuId() + ':' + id;
  const exCfg = id => Object.assign(recOf(id), state.wkCfg[cfgKey(id)] || {});
  const cfgStep = (e, k) => k === 'sets' ? 1 : k === 'reps' ? (isSec(e) ? 5 : 1) : 15;
  const cfgMin = (e, k) => k === 'sets' ? 1 : k === 'reps' ? (isSec(e) ? 5 : 1) : 15;
  const cfgMax = (e, k) => k === 'sets' ? 10 : k === 'reps' ? (isSec(e) ? 300 : 100) : 300;
  const cfgIsRec = id => { const r = recOf(id), c = exCfg(id); return c.sets === r.sets && c.reps === r.reps && c.rest === r.rest; };
  const cfgVal = (id, k) => { const e = EX[id], v = exCfg(id)[k]; return k === 'sets' ? `${v}` : k === 'reps' ? `${v}<small>${isSec(e) ? '秒' : '回'}</small>` : `${v}<small>秒</small>`; };

  function cfgHtml(id) {

      <div class="cfg">${stp('sets', e.each ? 'セット（左右各）' : 'セット')}${stp('reps', isSec(e) ? '時間' : '回数')}${stp('rest', '休憩')}</div>

  /* ---- セットの進み具合（その日ぶん） ---- */
  const setsDone = id => (state.wkSets[todayKey()] || {})[id] || 0;
  const setSetsDone = (id, n) => { const k = todayKey(); (state.wkSets[k] || (state.wkSets[k] = {}))[id] = n; if (n > 0) state.wkTs[k] = Date.now(); };
  function setRowHtml(id) {
    const e = EX[id], c = exCfg(id), done = Math.min(setsDone(id), c.sets), fin = done >= c.sets;
    const pills = Array.from({ length: c.sets }, (_, i) => `<button type="button" class="sp${i < done ? ' on' : ''}" data-act="wk-setpill" data-ex="${id}" data-k="${i + 1}" aria-label="${i + 1}セット目${i < done ? '（完了）' : ''}">${i + 1}</button>`).join('');

  function wkSetDone(id, on) {

  function wkPill(id, k) {
    const c = exCfg(id), cur = setsDone(id), n = k <= cur ? k - 1 : k;

  /* ---- メニュー選択 ---- */
  const daysText = m => DAYORDER.filter(d => m.days[d]).map(d => wkNames[d]).join('・');
  const menuExNames = m => { const ids = []; DAYORDER.forEach(d => m.days[d] && m.days[d].ex.forEach(x => { if (!ids.includes(x)) ids.push(x); })); return ids; };

  function wkMenuHtml() {
    const keys = Object.keys(MENUS);
    const items = keys.map(id => {
      const m = MENUS[id], sel = id === curMenuId();
      const n = DAYORDER.filter(d => m.days[d]).length;
      return `<div class="mn${sel ? ' sel' : ''}" role="button" tabindex="0" data-act="wk-pick" data-m="${id}" aria-pressed="${sel}">
        <span class="mn-ck"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 5"/></svg></span>
        <span class="mn-top"><b>${esc(m.name)}</b>${m.badge ? '<em class="tag-rec">おすすめ</em>' : ''}${m.custom ? '<em class="tag-mine">自作</em>' : ''}</span>
        <span class="mn-meta"><i class="lv">${esc(m.level)}</i>${n ? `${daysText(m)}（週${n}回）` : '種目がありません'}</span>
        <span class="mn-desc">${esc(m.desc)}</span>
        <span class="mn-ex">${menuExNames(m).map(x => `<i>${esc(EX[x].name.replace(/（.*?）/g, ''))}</i>`).join('')}</span>
        ${m.gear ? `<span class="mn-gear">使うもの：${esc(m.gear)}</span>` : ''}
        ${m.custom ? `<button type="button" class="mn-edit" data-act="wk-ed-open" data-m="${m.id}">編集</button>` : ''}
      </div>`;
    }).join('');
    return `<div class="sheet-head"><h2>メニューを選ぶ</h2><button class="link" data-act="close">閉じる</button></div>
      <div class="sheet-body"><p class="note">選んだメニューで、曜日ごとの筋トレが表示されます。セット数・回数・休憩は、あとから自由に変えられます。</p>
      <button type="button" class="mn-new" data-act="wk-ed-new"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>自分のメニューをつくる</button>
      ${items}</div>`;
  }

  function renderWorkout(anim) {
    stopWkAnim(); wkFigs = {};
    if (wkSelDay !== todayKey()) { wkSel = new Date().getDay(); wkSelDay = todayKey(); }
    const m = curMenu(), today = new Date().getDay(), isToday = wkSel === today, sess = m.days[wkSel] || null;
    const bar = `<div class="wk-top"><button type="button" class="wk-menu" data-act="wk-menu-open" aria-label="メニューを選ぶ">
      <span class="wm-ic"><svg class="i" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg></span>
      <span class="wm-t"><small>メニュー</small><b>${esc(m.name)}${m.badge ? '<em class="tag-rec">おすすめ</em>' : ''}${m.custom ? '<em class="tag-mine">自作</em>' : ''}</b></span>
      <span class="wm-go">変更</span></button>
      <button type="button" class="wk-tbtn" data-act="tm-open" aria-label="タイマー"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 1.5M9.5 3h5"/></svg><span>タイマー</span></button></div>`;
    const strip = `<div class="wk-days" role="tablist" aria-label="曜日">${[0, 1, 2, 3, 4, 5, 6].map(d => `<button class="wk-day${d === wkSel ? ' sel' : ''}${d === today ? ' today' : ''}${m.days[d] ? ' has' : ''}" data-act="wk-day" data-d="${d}" role="tab" aria-selected="${d === wkSel}"><span>${wkNames[d]}</span><i></i></button>`).join('')}</div>`;
    const head = `<div class="wk-head"><h2>${wkNames[wkSel]}曜日${isToday ? '<small>今日</small>' : ''}</h2><span>${sess ? esc(sess.title) : '休養日'}</span></div>`;
    $('#wk-body').innerHTML = bar + strip + head + `<div id="wk-sum">${isToday && sess ? wkSummaryHtml() : ''}</div>` + (sess ? sess.ex.map((id, i) => exCardHtml(id, i, isToday, anim)).join('') : restHtml(isToday, wkSel));
    if (sess) sess.ex.forEach(id => {
      if (!WK.has(id)) return;
      const stage = $(`#wk-body .stage[data-ex="${id}"]`);
      const f = WK.make(id, EX[id].name);
      stage.querySelector('.stage-svg').appendChild(f.svg);
      f.bind(stage);
      wkFigs[id] = f;
    });
    syncWorkoutAnim();
  }


  /* ---------- 今日の消費カロリーと回復の目安 ---------- */
  // 運動強度（METs）。セット間の休憩を含めた「ふつうの筋トレ」の平均的な強さ（目安）
  const EX_MET = { cr: 3.0, lr: 3.3, plk: 3.3, br: 3.3, sm: 3.0, ppu: 4.0, dpu: 4.5, pkpu: 4.5, nrpu: 4.0, bd: 3.8, sq: 4.2, lg: 4.2, tr: 4.0, pu: 5.0, ir: 4.5, hlr: 4.2, bss: 5.0, dips: 5.0, rdd: 4.2, mc: 7.0 };
  const EX_MUSCLE = {
    dpu: ['chest', 'shoulder', 'arm'], pkpu: ['shoulder', 'arm'], nrpu: ['arm', 'chest'], ppu: ['chest', 'shoulder', 'arm'], bd: ['arm'], dips: ['chest', 'arm'], rdd: ['shoulder', 'back'],
    pu: ['back', 'arm'], ir: ['back', 'arm'], tr: ['back', 'arm'], sm: ['back', 'leg'],
    hlr: ['core'], lr: ['core'], cr: ['core'], plk: ['core'], mc: ['core', 'shoulder'],
    sq: ['leg'], lg: ['leg'], bss: ['leg'], br: ['leg']
  };
  // 部位ごとの回復の基本時間（時間）。ふつうは「同じ部位は48時間あける」が目安
  const MG = { chest: ['胸', 48], shoulder: ['肩', 48], arm: ['腕', 48], back: ['背中', 48], core: ['腹筋・体幹', 24], leg: ['脚・お尻', 60], other: ['そのほか', 24] };
  const userKg = () => { const w = +state.nut.weight; return w >= 30 && w <= 250 ? w : 0; };

  function fmtNext(d) {
    const h = d.getHours();
    return `${d.getMonth() + 1}/${d.getDate()}（${wkNames[d.getDay()]}）${h < 12 ? '午前' : h < 18 ? '午後' : '夜'}`;
  }

  function wkSummary(dateKey) {
    const kg = userKg() || 60, arr = state.wk[dateKey] || [], setsMap = state.wkSets[dateKey] || {};
    const ids = [];
    Object.keys(setsMap).forEach(id => { if (setsMap[id] > 0 && !ids.includes(id)) ids.push(id); });
    arr.forEach(id => { if (!ids.includes(id)) ids.push(id); });
    const out = { kg, kgKnown: !!userKg(), kcal: 0, net: 0, workSec: 0, restSec: 0, sets: 0, rows: [], groups: [] };
    const gsets = {};
    ids.forEach(id => {
      const e = EX[id]; if (!e) return;
      const c = exCfg(id);
      const n = setsMap[id] > 0 ? Math.min(setsMap[id], c.sets) : (arr.includes(id) ? c.sets : 0);
      if (!n) return;
      const work = n * (isSec(e) ? c.reps : c.reps * 3.5 * (e.each ? 2 : 1));
      const rest = Math.max(0, n - 1) * c.rest;
      const met = EX_MET[id] || 4.0, hr = (work + rest) / 3600;
      const kcal = met * kg * hr, net = Math.max(0, met - 1) * kg * hr;
      out.kcal += kcal; out.net += net; out.workSec += work; out.restSec += rest; out.sets += n;
      out.rows.push({ id, name: e.name.replace(/（.*?）/g, ''), sets: n, of: c.sets, kcal });
      (EX_MUSCLE[id] || ['other']).forEach(m => { gsets[m] = (gsets[m] || 0) + n; });
    });
    const gd = state.gh && state.gh.data;
    const shortSleep = !!(gd && gd.sleepMin && gd.sleepMin < 360);
    const ts = state.wkTs[dateKey] || Date.now();
    Object.keys(gsets).forEach(m => {
      const s = gsets[m], base = MG[m][1];
      let h = base + (s >= 12 ? 24 : s >= 8 ? 12 : s <= 3 ? -12 : 0) + (shortSleep ? 12 : 0);
      h = Math.max(12, Math.round(h / 12) * 12);
      out.groups.push({ k: m, name: MG[m][0], sets: s, hours: h, next: new Date(ts + h * 3600000) });
    });
    out.groups.sort((a, b) => b.hours - a.hours);
    out.shortSleep = shortSleep;
    return out;
  }

  function wkSummaryHtml() {
    const s = wkSummary(todayKey());
    if (!s.sets) return `<section class="sum sum-empty"><b>今日の消費と回復</b><span>セットをこなすと、ここに消費カロリーと回復の目安が出ます。</span></section>`;
    const min = x => Math.max(1, Math.round(x / 60));
    const gd = state.gh && state.gh.data, tk = todayKey();
    const gx = gd && (gd.exercises || []).filter(x => x.date === tk);
    const rows = s.rows.map(r => `<li><span><b>${esc(r.name)}</b><small>${r.sets}/${r.of}セット</small></span><span>約${Math.round(r.kcal)}kcal</span></li>`).join('');
    const rec = s.groups.map(g => `<li><span class="rc-n">${esc(g.name)}</span><span class="rc-h">約${g.hours}時間</span><span class="rc-d">${fmtNext(g.next)}ごろから</span></li>`).join('');
    const maxH = s.groups.length ? s.groups[0].hours : 0;
    return `<section class="sum">
      <h3>今日の消費と回復の目安</h3>
      <div class="sum-trio"><div><b>約${Math.round(s.kcal)}</b><span>消費kcal</span></div><div><b>約${min(s.workSec + s.restSec)}分</b><span>運動時間</span></div><div><b>約${min(s.restSec)}分</b><span>セット間の休憩</span></div></div>
      <p class="sum-foot">安静にしていても使うぶんを除くと、運動による上乗せは約${Math.round(s.net)}kcalです。${s.kgKnown ? '' : '体重が未入力なので60kgで計算しています（栄養タブで入力すると正確になります）。'}</p>
      <ul class="sum-ex">${rows}</ul>
      ${gx && gx.length ? `<div class="sum-g"><b>Googleヘルスの運動記録</b>${gx.map(x => `<span>${esc(x.name)} ${x.min}分${x.kcal != null ? ` 約${Math.round(x.kcal)}kcal` : ''}</span>`).join('')}</div>` : ''}
      <h4>必要な回復時間</h4>
      <ul class="sum-rec">${rec}</ul>
      <p class="sum-foot">同じ部位は${maxH >= 48 ? '48時間以上' : '時間をあけて'}休ませると回復しやすくなります。${s.shortSleep ? '直近の睡眠が6時間より短いので、回復を少し長めにしています。' : '睡眠は7時間以上を目安に。'}たんぱく質をしっかりとって、回復を助けましょう。</p>
    </section>`;
  }
  function wkRefreshSummary() {
    const el = $('#wk-sum'); if (!el) return;
    const today = new Date().getDay();
    el.innerHTML = wkSel === today ? wkSummaryHtml() : '';
  }


  /* ---------- タイマー（音つき） ---------- */
  let actx = null;
  function audioUnlock() {
    try {
      if (navigator.audioSession) navigator.audioSession.type = 'playback';   // iPhoneのマナーモードでも鳴らす（対応OSのみ）
      if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; actx = new AC(); }
      if (actx.state === 'suspended') actx.resume();
    } catch (e) {}
  }
  ['pointerdown', 'touchend', 'click'].forEach(t => document.addEventListener(t, audioUnlock, { passive: true }));
  function beep(freq, dur, when, vol, type) {
    if (!state.snd || !actx) return;
    try {
      const t = actx.currentTime + (when || 0), o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || .3, t + .015);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + dur + .03);
    } catch (e) {}
  }
  const SFX = {
    tick() { beep(880, .09, 0, .28); },
    go() { beep(1175, .12, 0, .35); beep(1568, .3, .13, .35); },
    done() { [0, .2, .4].forEach(w => beep(1046, .14, w, .4)); beep(1568, .55, .65, .4); },
    test() { beep(988, .12, 0, .35); beep(1318, .2, .14, .35); }
  };
  function vibrate(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

  let tm = null, tmIv = 0, tmWake = null, tmFree = 60;
  const TM_CIRC = 2 * Math.PI * 30;
  const fmtTime = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

  async function wakeOn() {
    try { if (navigator.wakeLock && !tmWake) { tmWake = await navigator.wakeLock.request('screen'); tmWake.addEventListener('release', () => { tmWake = null; }); } } catch (e) {}
  }
  function wakeOff() { try { if (tmWake) { tmWake.release(); tmWake = null; } } catch (e) {} }

  function startTimer(o) {
    stopTimer(true);
    audioUnlock();
    tm = Object.assign({ i: 0, paused: false, lastSec: -1 }, o);
    tmBegin();
    clearInterval(tmIv); tmIv = setInterval(tmTick, 100);
    wakeOn();
    $('#timer').hidden = false;
    tmRender();
  }
  function stopTimer(silent) {
    clearInterval(tmIv); tmIv = 0; tm = null; wakeOff();
    const el = $('#timer'); if (el && !silent) el.hidden = true;
  }
  function tmBegin() {
    const p = tm.phases[tm.i];
    tm.total = p.sec * 1000; tm.endAt = Date.now() + tm.total; tm.paused = false; tm.lastSec = -1;
    if (p.kind === 'work') { SFX.go(); vibrate(60); }
    tmRender();
  }
  const tmRemain = () => Math.max(0, tm.paused ? tm.remain : tm.endAt - Date.now());
  function tmTick() {
    if (!tm || tm.paused) return;
    const rem = tmRemain(), sec = Math.ceil(rem / 1000);
    if (sec !== tm.lastSec) {
      if (sec > 0 && sec <= 3 && tm.phases[tm.i].kind !== 'free-silent') SFX.tick();
      tm.lastSec = sec;
    }
    tmRender();
    if (rem <= 0) tmPhaseDone();
  }
  function tmPhaseDone() {
    const t = tm, p = t.phases[t.i];
    if (t.i + 1 < t.phases.length) { t.i++; tmBegin(); return; }
    SFX.done(); vibrate([200, 100, 200]);
    stopTimer(true);
    if (p.kind === 'work') { $('#timer').hidden = true; completeSet(t.exId); return; }
    if (p.kind === 'rest') toast(`休憩おわり！ ${t.setNo}セット目いこう`);
    else toast('タイマー終了');
    const el = $('#timer'); el.dataset.kind = 'end'; $('#tm-kind').textContent = 'おわり'; $('#tm-time').textContent = '0:00';
    $('#tm-prg').style.strokeDashoffset = String(TM_CIRC);
    setTimeout(() => { if (!tm) el.hidden = true; }, 3500);
  }
  function tmRender() {
    const el = $('#timer'); if (!el) return;
    if (!tm) { return; }
    const p = tm.phases[tm.i], rem = tmRemain();
    el.dataset.kind = p.kind;
    $('#tm-kind').textContent = { ready: '準備', work: '運動中', rest: '休憩', free: 'タイマー' }[p.kind] || '';
    $('#tm-time').textContent = fmtTime(Math.ceil(rem / 1000));
    $('#tm-label').textContent = tm.label || '';
    $('#tm-sub').textContent = tm.exId ? (p.kind === 'rest' ? `次は ${tm.setNo}セット目` : `${tm.setNo}セット目 / ${tm.sets}`) : '';
    $('#tm-prg').style.strokeDashoffset = String(TM_CIRC * (1 - (tm.total ? rem / tm.total : 0)));
    $('#tm-pause').setAttribute('aria-label', tm.paused ? '再開' : '一時停止');
    $('#timer').classList.toggle('paused', tm.paused);
  }
  function tmPause() {
    if (!tm) return;
    if (tm.paused) { tm.endAt = Date.now() + tm.remain; tm.paused = false; }
    else { tm.remain = Math.max(0, tm.endAt - Date.now()); tm.paused = true; }
    tmRender();
  }
  function tmAdd(sec) {
    if (!tm) return;
    if (tm.paused) tm.remain += sec * 1000; else tm.endAt += sec * 1000;
    tm.total += sec * 1000; tm.lastSec = -1; tmRender();
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && tm) { wakeOn(); tmTick(); } });

  /* ---- 自由なタイマー（シート） ---- */
  const TM_PRESETS = [30, 45, 60, 90, 120, 180];
  function tmSheetHtml() {
    return `<div class="sheet-head"><h2>タイマー</h2><button class="link" data-act="close">閉じる</button></div>
      <div class="sheet-body">
        <div class="tm-big"><button type="button" data-act="tm-step" data-d="-1" aria-label="減らす">−</button><b id="tm-free-v">${fmtTime(tmFree)}</b><button type="button" data-act="tm-step" data-d="1" aria-label="増やす">＋</button></div>
        <div class="tm-presets">${TM_PRESETS.map(s => `<button type="button" class="${s === tmFree ? 'on' : ''}" data-act="tm-preset" data-s="${s}">${s < 60 ? s + '秒' : s % 60 === 0 ? (s / 60) + '分' : Math.floor(s / 60) + '分' + (s % 60) + '秒'}</button>`).join('')}</div>
        <button type="button" class="primary wide" data-act="tm-start">スタート</button>
        <div class="tm-snd"><span><b>音</b><small>終わる3秒前から「ピッ」、終了で鳴ります</small></span>
          <button type="button" class="tgl${state.snd ? ' on' : ''}" data-act="tm-snd" role="switch" aria-checked="${state.snd}" aria-label="音"><i></i></button></div>
        <p class="note">画面が消えると、時間のカウントは続いても音が鳴らないことがあります。タイマー中は画面を点けたままにしてください（自動で消えにくくなります）。iPhoneのマナーモードがオンだと、音が鳴らない場合があります。</p>
      </div>`;
  }


  /* ---------- 自分のメニュー・種目をつくる ---------- */
  let ed = null;   // { id, name, days:{d:{title,ex:[]}}, view:'main'|'pick'|'ex', day, cat, exf }
  const newEd = m => {
    const days = {};
    for (let d = 0; d < 7; d++) { const s = m && m.days[d]; days[d] = { title: s ? s.title : '', ex: s ? s.ex.slice() : [] }; }
    return { id: m ? m.id : null, name: m ? m.name : '', days, view: 'main', day: 1, cat: 'all', exf: null };
  };

  function edMainHtml() {
    const blocks = DAYORDER.map(d => {
      const day = ed.days[d];
      const li = day.ex.map((id, i) => `<li><span>${esc(EX[id] ? EX[id].name : '（削除された種目）')}</span><span class="edbtn">
        <button type="button" data-act="wk-ed-mv" data-d="${d}" data-i="${i}" data-dir="-1" aria-label="上へ"${i === 0 ? ' disabled' : ''}>▲</button>
        <button type="button" data-act="wk-ed-mv" data-d="${d}" data-i="${i}" data-dir="1" aria-label="下へ"${i === day.ex.length - 1 ? ' disabled' : ''}>▼</button>
        <button type="button" data-act="wk-ed-rm" data-d="${d}" data-i="${i}" aria-label="外す">✕</button></span></li>`).join('');
      return `<section class="edday"><div class="edday-h"><b>${wkNames[d]}曜日</b>
        <input class="field sm" data-ed="title" data-d="${d}" maxlength="16" placeholder="名前（例：胸の日）" value="${esc(day.title)}" aria-label="${wkNames[d]}曜日の名前"></div>
        ${day.ex.length ? `<ul class="edlist">${li}</ul>` : '<p class="edrest">休養日（種目なし）</p>'}
        <button type="button" class="edadd" data-act="wk-ed-add" data-d="${d}">＋ 種目を追加</button></section>`;
    }).join('');
    return `<div class="sheet-head"><h2>${ed.id ? 'メニューを編集' : 'メニューをつくる'}</h2><button class="link" data-act="wk-ed-cancel">キャンセル</button></div>
      <div class="sheet-body">
        <input class="field full" data-ed="name" maxlength="24" placeholder="メニューの名前（例：夜の胸トレ）" value="${esc(ed.name)}" aria-label="メニューの名前" autocomplete="off">
        <p class="note">曜日ごとに、やる種目を選びます。種目を入れない曜日は休養日になります。</p>
        ${blocks}
        <button type="button" class="primary wide" data-act="wk-ed-save">保存してこのメニューにする</button>
        ${ed.id ? '<button type="button" class="danger" data-act="wk-ed-delmenu">このメニューを削除</button>' : ''}
      </div>`;
  }

  function edPickHtml() {
    const d = ed.day, sel = ed.days[d].ex;
    const cats = ['all', 'push', 'pull', 'core', 'leg', 'mine'];
    const ids = Object.keys(EX).filter(id => ed.cat === 'all' || exCat(id) === ed.cat);
    const rows = ids.map(id => {
      const e = EX[id], on = sel.includes(id);
      return `<li><button type="button" class="pk${on ? ' on' : ''}" data-act="wk-ed-pick" data-id="${id}" aria-pressed="${on}">
        <span class="pk-ck"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 5"/></svg></span>
        <span class="pk-t"><b>${esc(e.name)}${e.custom ? '<em class="tag-mine">自作</em>' : ''}</b><small>${esc(e.sub)}</small></span></button></li>`;
    }).join('');
    return `<div class="sheet-head"><h2>${wkNames[d]}曜日の種目</h2><button class="link" data-act="wk-ed-pickdone">完了（${sel.length}）</button></div>
      <div class="sheet-body">
        <div class="cats">${cats.map(c => `<button type="button" class="${ed.cat === c ? 'on' : ''}" data-act="wk-ed-cat" data-c="${c}">${c === 'all' ? 'すべて' : CAT_NAMES[c]}</button>`).join('')}</div>
        ${rows ? `<ul class="pklist">${rows}</ul>` : '<p class="empty">この分類の種目はありません。</p>'}
        <button type="button" class="edadd" data-act="wk-ex-new">＋ 自分の種目をつくる</button>
      </div>`;
  }

  function edExHtml() {
    const f = ed.exf;
